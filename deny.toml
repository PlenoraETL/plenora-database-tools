# Supply-chain policy: advisories denied without exceptions; permissive
# licenses allowlisted; only crates.io sources or reviewed local patches.
# The scheduled supply-chain workflow checks workspace and fuzz graphs.

# ============================================================================
#  advisories
# ============================================================================

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []
# ============================================================================
#  licenses
# ============================================================================

[licenses]
version = 2
# Licenze permissive largamente compatibili con distribuzione binaria.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots (Mozilla root CA bundle) è distribuito sotto CDLA
    # Permissive 2.0, licenza permissiva compatibile con distribuzione
    # binaria (equivalente pratico a MIT/Apache per dati).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # `ring` è ISC AND MIT AND OpenSSL: le license clause OpenSSL sono
    # storiche ma esplicite. Documentato accepted.
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
    # `libfuzzer-sys` incorpora LLVM libFuzzer sotto NCSA: licenza
    # permissiva con obblighi di attribuzione, limitata al crate del lock
    # separato di `fuzz/` invece di ampliare la allowlist generale.
    { allow = ["MIT", "Apache-2.0", "NCSA"], crate = "libfuzzer-sys" },
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# I crate del workspace sono proprietari, ereditano `publish = false` e non
# sono dipendenze di terze parti. Questa esclusione non modifica la allowlist:
# cargo-deny continua a verificare le licenze di ogni dipendenza esterna.
[licenses.private]
ignore = true

# ============================================================================
#  bans (duplicati e crate proibiti)
# ============================================================================

[bans]
multiple-versions = "warn"
# I nostri workspace crate usano `foo.workspace = true` che cargo-deny
# rileva come wildcard: le dipendenze inter-workspace hanno versione
# gestita dal manifest root, quindi non è un rischio effettivo.
# `workspace-default-features` scoped a "allow" mantiene il gate su
# wildcard **verso dipendenze esterne** (che restano `deny`).
wildcards = "deny"
allow-wildcard-paths = true
# Vietiamo esplicitamente crypto legacy o già deprecato ove possibile.
# openssl-sys e derivati: preferiamo la stack rustls per portabilità.
deny = [
    { name = "rustls-pemfile" },
    { name = "rustls", version = "<0.23" },
    { name = "rustls-webpki", version = "<0.103.13" },
]
skip = []
skip-tree = []

# ============================================================================
#  sources (origini crate accettate)
# ============================================================================

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
