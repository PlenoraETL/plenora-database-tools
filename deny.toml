# cargo-deny policy per plenora-database-tools.
#
# Regola generale: advisory = deny; licenze in allowlist ristretta;
# duplicati di dipendenze critiche di sicurezza (rustls*, tokio) = deny.
#
# Le eccezioni documentate qui sotto sono limitate a dipendenze opzionali o a
# percorsi dimostrati non raggiungibili. Ognuna dichiara portata, condizione di
# rimozione e data di revisione: non certifica il provider che la introduce.
#
# Un'eccezione vale finche il suo presupposto regge, e il presupposto qui e
# sempre "upstream non ha ancora rilasciato". Verificarlo e il senso della data
# di revisione: senza qualcuno che la esegue, la nota invecchia e l'eccezione
# resta per inerzia. `.github/workflows/supply-chain.yml` esegue questa policy
# anche a calendario.

# ============================================================================
#  advisories
# ============================================================================

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0104 →
    # rustls-webpki 0.101.7. Tre advisory sullo stesso crate:
    #   * 0098: name constraints per URI names accettati erroneamente
    #   * 0099: name constraints per DNS con wildcard accettati
    #   * 0104: reachable panic nel parsing di CRL malformate
    # Path condiviso: tiberius 0.12.3 → tokio-rustls 0.24 → rustls 0.21
    # → rustls-webpki 0.101.7.
    #
    # Motivo dell'eccezione:
    # - Non entrano nella default build del CLI (feature `sqlserver` opt-in).
    # - Non entrano nel path PostgreSQL, che usa una linea rustls-webpki
    #   distinta.
    # - Le CVE name-constraint sono reachable solo dopo signature verify
    #   e richiedono misissuance del CA. Il CRL panic richiede parsing
    #   di CRL malformate — path non attivo nel probe standard.
    #
    # Rimuovere quando tiberius rilascia con rustls ≥ 0.23.
    #
    # Revisione 2026-08-23: il presupposto dell'eccezione regge invariato.
    # Prossima revisione: 2027-Q1.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # RUSTSEC-2025-0134 → rustls-pemfile 1.0.4 e 2.2.0 unmaintained.
    # Nessuna vulnerabilità nota, solo dichiarazione di manutenzione ferma.
    # Il codice è stabile e limitato al parsing PEM. Path: sia tokio-rustls
    # (opzionale via mysql/sqlserver) sia direttamente per la nostra
    # gestione TLS. Rivalutare quando esiste una migrazione pulita.
    #
    # Revisione 2026-08-23: nessuna migrazione pulita disponibile.
    # Prossima revisione: 2027-Q1.
    "RUSTSEC-2025-0134",
    # RUSTSEC-2026-0176, RUSTSEC-2026-0177 → pyo3 < 0.29.0.
    #   * 0176: lettura fuori dai limiti in `nth`/`nth_back` degli iteratori
    #     di `PyList` e `PyTuple`
    #   * 0177: manca il bound `Sync` sulle closure di
    #     `PyCFunction::new_closure`
    #
    # Non raggiungibili da questo codice, verificato per simbolo:
    # - `PyCFunction` non compare in nessun crate del workspace;
    # - i `.nth(` ammessi dalla guardia sono su iteratori Rust, non sequenze
    #   Python.
    #
    # La verifica non resta un commento: `scripts/test_ci_workflows.py`
    # contiene una guardia che rilegge i sorgenti e fallisce se uno di quei
    # simboli compare mentre queste advisory sono ancora ignorate. Senza,
    # bastava una riga nuova per rendere il percorso raggiungibile lasciando
    # `cargo deny` verde.
    #
    # L'aggiornamento richiede la migrazione delle API pyo3 rimosse dalla
    # 0.24. La campagna SDK live copre PostgreSQL e MySQL; la migrazione resta
    # quindi l'unica condizione aperta, non una carenza di copertura.
    #
    # Rimuovere insieme alla migrazione a pyo3 0.29.
    # Prossima revisione: 2027-Q1.
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0177",
]
# ============================================================================
#  licenses
# ============================================================================

[licenses]
version = 2
# Licenze permissive largamente compatibili con distribuzione binaria.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots (Mozilla root CA bundle) è distribuito sotto CDLA
    # Permissive 2.0, licenza permissiva compatibile con distribuzione
    # binaria (equivalente pratico a MIT/Apache per dati).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # `ring` è ISC AND MIT AND OpenSSL: le license clause OpenSSL sono
    # storiche ma esplicite. Documentato accepted.
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# I crate del workspace sono proprietari, ereditano `publish = false` e non
# sono dipendenze di terze parti. Questa esclusione non modifica la allowlist:
# cargo-deny continua a verificare le licenze di ogni dipendenza esterna.
[licenses.private]
ignore = true

# ============================================================================
#  bans (duplicati e crate proibiti)
# ============================================================================

[bans]
multiple-versions = "warn"
# I nostri workspace crate usano `foo.workspace = true` che cargo-deny
# rileva come wildcard: le dipendenze inter-workspace hanno versione
# gestita dal manifest root, quindi non è un rischio effettivo.
# `workspace-default-features` scoped a "allow" mantiene il gate su
# wildcard **verso dipendenze esterne** (che restano `deny`).
wildcards = "deny"
allow-wildcard-paths = true
# Vietiamo esplicitamente crypto legacy o già deprecato ove possibile.
# openssl-sys e derivati: preferiamo la stack rustls per portabilità.
deny = []
# Il workspace ha genuinamente due versioni di alcuni crate low-level
# (arrow-*, syn, etc.) a causa di combinazioni tra tokio-postgres e le
# dipendenze Arrow. Skip espliciti dove ce lo aspettiamo.
skip = []
skip-tree = []

# ============================================================================
#  sources (origini crate accettate)
# ============================================================================

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
