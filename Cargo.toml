[workspace]
resolver = "2"
members = [
    "crates/plenora-database-core",
    "crates/plenora-database-sql",
    "crates/plenora-database-engine",
    "crates/plenora-database-testkit",
    "crates/plenora-db-postgres",
    "crates/plenora-db-sqlserver",
    "crates/plenora-database-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[workspace.dependencies]
arrow-array = "=59.1.0"
arrow-ipc = "=59.1.0"
arrow-schema = "=59.1.0"
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
sha2 = "=0.10.9"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
futures-util = "=0.3.31"
tokio = { version = "=1.49.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["compat"] }
tokio-postgres = { version = "=0.7.15", features = ["with-chrono-0_4", "with-serde_json-1"] }
tiberius = { version = "=0.12.3", default-features = false, features = ["chrono", "rustls", "tds73"] }
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring", "webpki-roots"] }
webpki-roots = "=1.0.9"

plenora-database-core = { path = "crates/plenora-database-core" }
plenora-database-sql = { path = "crates/plenora-database-sql" }
plenora-database-engine = { path = "crates/plenora-database-engine" }
plenora-database-testkit = { path = "crates/plenora-database-testkit" }
plenora-db-postgres = { path = "crates/plenora-db-postgres" }
plenora-db-sqlserver = { path = "crates/plenora-db-sqlserver" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
