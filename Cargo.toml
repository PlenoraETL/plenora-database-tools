[workspace]
resolver = "2"
members = [
    "crates/plenora-database-core",
    "crates/plenora-database-sql",
    "crates/plenora-database-engine",
    "crates/plenora-database-testkit",
    "crates/plenora-db-postgres",
    "crates/plenora-db-sqlserver",
    "crates/plenora-db-mysql",
    "crates/plenora-db-db2",
    "crates/plenora-db-oracle",
    "crates/plenora-database-cli",
    "crates/plenora-database-py",
]
exclude = ["vendor/oracle-rs"]

# `default-members` mantiene leggero il percorso ordinario; adapter opzionali e
# binding restano selezionabili esplicitamente. La scelta governa la build, non
# la risoluzione: i controlli supply-chain leggono comunque il lockfile unico
# dell'intero workspace.
default-members = [
    "crates/plenora-database-core",
    "crates/plenora-database-sql",
    "crates/plenora-database-engine",
    "crates/plenora-database-testkit",
    "crates/plenora-db-postgres",
    "crates/plenora-database-cli",
]

[workspace.package]
version = "7.0.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
# I crate non sono pubblicati e usano la licenza proprietaria del repository.
# `license-file` e il campo Cargo previsto quando non esiste un identificatore
# SPDX applicabile; i manifest figli lo ereditano dal workspace.
license-file = "LICENSE"

[workspace.dependencies]
# Arrow e il data plane: `arrow-array` porta i `RecordBatch` del confine core
# (letture e scritture bulk) e la conversione di riga nell'adapter PostgreSQL.
# I tre crate Arrow stanno sulla stessa versione: tipi di versioni diverse non
# sono intercambiabili.
arrow-array = "=60.0.0"
# File e stream Arrow IPC della CLI (`read`/`write`) e del binding Python.
arrow-ipc = "=60.0.0"
# Schema e metadati di campo del contratto Arrow (`field_contract`); `serde`
# serializza gli schemi nei documenti di stato e capability.
arrow-schema = { version = "=60.0.0", features = ["serde"] }
# Buffer dei valori del protocollo PostgreSQL (codec dei parametri, COPY,
# conversione Arrow): sono i tipi che `tokio-postgres` chiede ai trait `ToSql`.
bytes = "=1.12.1"
# (De)serializzazione dei piani, dei contratti JSON e dei documenti
# capability in tutti i crate.
serde = { version = "=1.0.229", features = ["derive"] }
# JSON dei contratti v2, dei documenti CLI e dei fingerprint canonici.
serde_json = "=1.0.151"
# Solo nell'adapter SQL Server: `native_query_policy` analizza lo statement
# nativo per applicarvi la policy prima dell'invio. Senza feature di default.
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
# Derive di `std::error::Error` per `DatabaseError` nel core. Stessa versione
# di data-tools2: due pin esatti diversi della stessa major non si risolvono
# nel grafo di un consumatore che usa entrambe le librerie.
thiserror = "=2.0.21"
# SHA-256 dei fingerprint di piano, statement e schema, dei checkpoint di
# lettura e delle evidenze dei provider.
sha2 = "=0.11.0"
# Solo CLI: ricodifica in PEM i certificati DER delle CA private.
base64 = "=0.23.1"
# Date e timestamp dei valori nativi e della conversione Arrow negli adapter;
# solo `std`, senza `clock`: il codice non legge l'orologio di sistema.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# Combinatori di stream e sink per lo streaming di righe e COPY negli adapter
# PostgreSQL, MySQL e SQL Server.
futures-util = "=0.3.34"
# Runtime async della CLI, dell'engine (deadline e task) e degli adapter;
# solo le feature usate, niente `full`.
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# Solo SQL Server: `compat` adatta il `TcpStream` di tokio ai trait
# `futures` che `tiberius` richiede.
tokio-util = { version = "=0.7.19", features = ["compat"] }
# Driver dell'adapter PostgreSQL (protocollo, COPY, tipi chrono e JSON);
# pin verificato dal gate cargo-deny.
tokio-postgres = { version = "=0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
# Driver TDS dell'adapter SQL Server (`tiberius-ng`, fork di tiberius), con
# TLS rustls e senza native-tls.
tiberius = { package = "tiberius-ng", version = "=0.13.1", default-features = false, features = ["chrono", "rustls", "tds73"] }
# Driver dell'adapter MySQL/MariaDB, solo Rust (`minimal-rust`) e TLS rustls
# con `ring`: niente OpenSSL nella wheel.
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "chrono"] }
# Solo dev-dependency di `plenora-db-mysql`: `mysql_async` riesporta il tipo
# `Row` ma non il costruttore `row::new_row`, quindi i test offline del
# batching non potrebbero fabbricare righe senza server. E la stessa versione
# gia risolta come dipendenza transitiva di `mysql_async`: nessuna superficie
# supply-chain aggiuntiva.
mysql_common = { version = "=0.37.3", default-features = false }
# DB2 usa il driver manager ODBC dinamico. Niente feature `prompt` (UI) e
# niente unixODBC statico: il runtime IBM resta un prerequisito separato.
odbc-api = { version = "=29.0.0", default-features = false, features = ["odbc_version_3_80"] }
# Driver thin asincrono: parla TNS senza Oracle Instant Client, quindi il
# supporto Oracle non introduce una seconda famiglia di wheel native.
#
# E il fork in `vendor/oracle-rs` di `oracle-rs` 0.1.7, con un nome di
# pacchetto proprio e la libreria con il nome upstream (`oracle_rs`), quindi
# il codice non cambia. `oracle-rs` 0.1.7 riconosce il flag TNS `TLS_RENEG` ma
# non esegue il secondo handshake richiesto dai listener TCPS tradizionali; il
# fork conserva l'API upstream e usa il parser PEM di rustls-pki-types.
#
# Era un `[patch.crates-io]`, che Cargo applica solo dal workspace radice: chi
# usa database-tools come dipendenza, per path o per git, riceveva l'upstream
# senza il delta e senza errore. Una dipendenza `path` vale invece anche per
# lui (`scripts/check_consumer_fork.py`).
oracle-rs = { package = "plenora-oracle-rs", path = "vendor/oracle-rs" }
# TLS dei driver PostgreSQL e Oracle e delle CA private della CLI e del
# binding; provider crittografico `ring`, senza aws-lc.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Ponte fra `tokio-postgres` e rustls per le connessioni PostgreSQL TLS.
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring", "webpki-roots"] }
# Radici pubbliche della configurazione TLS PostgreSQL predefinita
# (`PostgresTlsConfig::webpki`); i costruttori a CA privata non le caricano.
webpki-roots = "=1.0.9"

plenora-database-core = { path = "crates/plenora-database-core" }
plenora-database-sql = { path = "crates/plenora-database-sql" }
plenora-database-engine = { path = "crates/plenora-database-engine" }
plenora-database-testkit = { path = "crates/plenora-database-testkit" }
plenora-db-postgres = { path = "crates/plenora-db-postgres" }
plenora-db-sqlserver = { path = "crates/plenora-db-sqlserver" }
plenora-db-mysql = { path = "crates/plenora-db-mysql" }
plenora-db-db2 = { path = "crates/plenora-db-db2" }
plenora-db-oracle = { path = "crates/plenora-db-oracle" }

# Le dipendenze di `vendor/oracle-rs` restano intervalli (`"0.8"`, `"1"`):
# il manifest e quello pubblicato upstream, toccato solo dove serve il fork
# (nome del pacchetto e codice), cosi un nuovo vendoring resta un diff
# leggibile. Le versioni effettive le fissa `Cargo.lock`, che i build e i test
# della CI usano con `--locked` o senza modificarlo, e che cargo-deny controlla
# per intero.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# Il default di Rust attiva i controlli di overflow in debug e li disattiva in
# release: un'aritmetica che va oltre il tipo, in produzione, avvolge in
# silenzio. Per un componente a semantica fail-closed e' il verso sbagliato —
# un conteggio di righe o un offset avvolto e' plausibile, falso, e prosegue
# nella pipeline senza che alcun gate lo veda.
#
# Con questa riga l'overflow diventa un panico dichiarato anche in release, e
# quindi un fallimento visibile invece di un dato corrotto. Il gate anti-panic
# resta coerente: vieta le primitive di panico *scritte*, non i controlli del
# compilatore su un'invariante violata.
#
# Costo misurato sui microbenchmark offline, riportato in
# benchmarks/offline-rust-microbench.md.
overflow-checks = true
