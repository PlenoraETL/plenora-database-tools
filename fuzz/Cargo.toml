[package]
name = "plenora-database-tools-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep nightly/libFuzzer outside the stable workspace and its MSRV contract.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
plenora-database-core = { path = "../crates/plenora-database-core" }
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }

[[bin]]
name = "ewkb_parser"
path = "fuzz_targets/ewkb_parser.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
