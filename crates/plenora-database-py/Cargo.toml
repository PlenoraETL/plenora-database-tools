[package]
name = "plenora-database-py"
description = "Bindings Python (PyO3) di plenora-database-tools"
# Version esplicita — NON eredita workspace. Il SDK Python ha ciclo di
# release proprio (semver PyPI) separato dal Rust workspace.
# Deve coincidere con `pyproject.toml::version`: il nome della wheel e
# `p.version()` derivano da fonti diverse.
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true

[lib]
# Il nome della lib è il nome del modulo nativo importato in Python:
# `plenora_database._native` (vedi pyproject.toml module-name).
name = "plenora_database_native"
crate-type = ["cdylib"]

[features]
default = []
# Db2 usa il driver ODBC di sistema. Rimane fuori dai wheel multipiattaforma
# standard, che non possono assumere la presenza di unixODBC/IBM CLI Driver;
# gli artefatti DB2 lo abilitano esplicitamente e ne qualificano il runtime.
db2 = ["dep:plenora-db-db2"]

[dependencies]
plenora-database-core.workspace = true
plenora-database-engine.workspace = true
plenora-database-sql.workspace = true
plenora-db-postgres.workspace = true
plenora-db-mysql.workspace = true
plenora-db-sqlserver.workspace = true
plenora-db-db2 = { workspace = true, optional = true }
arrow-ipc.workspace = true
arrow-schema.workspace = true
# RUSTSEC-2025-0020: fino alla 0.24.0 `PyString::from_object` passava un
# `&str` all'API C di Python senza garantire il NUL finale, e l'interprete
# poteva leggere oltre la fine del buffer ed esporne il contenuto in
# un'eccezione. Corretta nella 0.24.1: il minimo qui sta sopra quella riga, e
# `"0.24"` non basterebbe perche ammetterebbe ancora la 0.24.0.
#
# Il workspace risolveva 0.23.5, cioe dentro l'intervallo vulnerabile. Il
# codice non chiama quella funzione, ma la raggiungibilita non e una difesa
# che si mantiene da sola: la prossima riga che la usasse non troverebbe
# nessun gate a fermarla.
pyo3 = { version = "=0.29.2", features = ["extension-module", "abi3-py310", "serde"] }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
