[package]
name = "plenora-database-py"
description = "Bindings Python (PyO3) di plenora-database-tools"
# Version esplicita — NON eredita workspace. Il SDK Python ha ciclo di
# release proprio (semver PyPI) separato dal Rust workspace (v1.x).
# Deve coincidere con `pyproject.toml::version` altrimenti wheel filename
# e `p.version()` divergono (bug v0.1.0 fixato in v0.1.1).
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[lib]
# Il nome della lib è il nome del modulo nativo importato in Python:
# `plenora_database._native` (vedi pyproject.toml module-name).
name = "plenora_database_native"
crate-type = ["cdylib"]

[dependencies]
plenora-database-core.workspace = true
plenora-db-postgres.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310", "serde"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
