[mypy]
strict = True
mypy_path = crates/plenora-database-py/python

# Il gate qualifica il contratto consumato dagli applicativi. Gli stub nativi
# contengono superfici dinamiche generate da PyO3 e vengono verificati dalla
# suite wheel/stub; non devono abbassare la severita del consumer 2.0.
[mypy-plenora_database]
ignore_errors = True
implicit_reexport = True

[mypy-plenora_database.*]
ignore_errors = True
implicit_reexport = True
