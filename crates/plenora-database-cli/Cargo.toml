[package]
name = "plenora-database-cli"
description = "CLI sottile per validare i piani plenora-database-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[[bin]]
name = "plenora-database"
path = "src/main.rs"

[features]
# Il default resta minimale; gli altri provider sono feature esplicite per non
# imporre dipendenze e superfici non richieste al binario Postgres.
default = ["postgres"]
postgres = ["dep:plenora-db-postgres"]
mysql = ["dep:plenora-db-mysql"]
sqlserver = ["dep:plenora-db-sqlserver"]
db2 = ["dep:plenora-db-db2"]
oracle = ["dep:plenora-db-oracle"]
full = ["postgres", "mysql", "sqlserver", "oracle", "db2"]

[dependencies]
arrow-ipc.workspace = true
base64.workspace = true
plenora-database-core.workspace = true
plenora-database-engine.workspace = true
plenora-db-mysql = { workspace = true, optional = true }
plenora-db-postgres = { workspace = true, optional = true }
plenora-db-sqlserver = { workspace = true, optional = true }
plenora-db-db2 = { workspace = true, optional = true }
plenora-db-oracle = { workspace = true, optional = true }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
