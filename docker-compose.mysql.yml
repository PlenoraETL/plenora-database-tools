# Riferimento baseline della matrice MySQL: MySQL 9.7.2, fissato per digest
# immutabile. Versione e digest sono dichiarati in docker/mysql/references.json
# ed e quel documento a comandare: `scripts/mysql_references.py` verifica che i
# due servizi qui sotto fissino esattamente l'immagine della baseline e nessun
# digest di compatibilita. I riferimenti 8.4 LTS e 8.0 non si avviano da qui ma
# da `scripts/check_mysql_matrix.py`, con la stessa fixture TLS e init.
# Progetto Compose esplicito. Senza questa riga Compose deriva il nome
# dalla directory, quindi tutti i compose del repository finirebbero nello
# stesso progetto e `down --remove-orphans` su uno cancellerebbe i
# container degli altri provider.
name: plenora-mysql

services:
  mysql-certgen:
    image: mysql@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    container_name: dataflow-mysql-certgen
    user: "0:0"
    volumes:
      - mysql_ca_private:/ca
      - mysql_tls:/tls
      - ./docker/mysql/tls:/fixture:ro
    entrypoint: ["/bin/bash", "/fixture/generate.sh"]
    command: ["/ca", "/tls", "/fixture/server.ext"]
    restart: "no"

  mysql:
    image: mysql@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    container_name: dataflow-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: dataflow_test
      MYSQL_USER: dataflow
      MYSQL_PASSWORD: "DataFlow_Test_2026!"
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --require-secure-transport=ON
      - --local-infile=OFF
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --ssl-ca=/etc/mysql/tls/ca.pem
      - --ssl-cert=/etc/mysql/tls/server.pem
      - --ssl-key=/etc/mysql/tls/server.key
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_tls:/etc/mysql/tls:ro
    depends_on:
      mysql-certgen:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - mysql-hostname-mismatch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 --protocol=TCP -u dataflow --ssl-mode=REQUIRED --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: "no"

volumes:
  mysql_data:
  mysql_ca_private:
  mysql_tls:
