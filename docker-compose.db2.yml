name: plenora-db2

services:
  db2:
    build:
      context: .
      dockerfile: docker/db2-client/Dockerfile
    image: plenora-db2-test:12.1.5
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: plenora_test
      DBNAME: plenora
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      PERSISTENT_HOME: "false"
      HADR_ENABLED: "false"
      IS_OSXFS: "false"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/plenora-db2-healthcheck
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 360s
    volumes:
      - db2-data:/database
      - db2-hadr:/hadr
    networks:
      - assurance

networks:
  assurance:
    internal: true

volumes:
  db2-data:
  db2-hadr:
