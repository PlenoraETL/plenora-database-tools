# Progetto Compose esplicito. Senza questa riga Compose deriva il nome
# dalla directory, quindi tutti i compose del repository finirebbero nello
# stesso progetto e `down --remove-orphans` su uno cancellerebbe i
# container degli altri provider.
name: plenora-sqlserver

services:
  sqlserver-certgen:
    image: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    container_name: dataflow-sqlserver-certgen
    user: "0:0"
    environment:
      PLENORA_TLS_ROTATE: "${PLENORA_TLS_ROTATE:-0}"
      PLENORA_TLS_ROTATE_CA: "${PLENORA_TLS_ROTATE_CA:-0}"
    volumes:
      - sqlserver_tls:/tls
      - ./docker/sqlserver/tls:/fixture:ro
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        if [[ "$$PLENORA_TLS_ROTATE_CA" == "1" || ! -s /tls/ca.pem || ! -s /tls/ca.key ]]; then
          rm -f /tls/ca.key /tls/ca.pem /tls/ca.srl
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -subj "/CN=Plenora SQL Server Test Root CA" \
            -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout /tls/ca.key -out /tls/ca.pem
        fi
        if [[ "$$PLENORA_TLS_ROTATE" == "1" || "$$PLENORA_TLS_ROTATE_CA" == "1" || ! -s /tls/server.pem || ! -s /tls/server.key ]]; then
          rm -f /tls/server.csr /tls/server.pem
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -subj "/CN=sqlserver" \
            -keyout /tls/server.key -out /tls/server.csr
          openssl x509 -req -sha256 -days 825 \
            -in /tls/server.csr -CA /tls/ca.pem -CAkey /tls/ca.key \
            -CAcreateserial -extfile /fixture/server.ext \
            -out /tls/server.pem
        fi
        chown 10001:10001 /tls/server.pem /tls/server.key
        chmod 0444 /tls/ca.pem /tls/server.pem
        chmod 0400 /tls/server.key
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    container_name: dataflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataFlow_Test_2026!"
      MSSQL_PID: Developer
    # Loopback esplicito: l'account `sa` di questo fixture ha una password
    # versionata, e senza indirizzo Compose la pubblicherebbe su 0.0.0.0.
    # Stessa forma gia usata dai fixture MySQL e MariaDB.
    #
    # **Due** indirizzi, e il secondo non e ridondante. Il certificato del
    # server copre `sqlserver`, `localhost` e `127.0.0.1` (vedi
    # `docker/sqlserver/tls/server.ext`), e il gate prova la verifica
    # dell'hostname connettendosi a `127.0.0.2`, che nel certificato non c'e.
    # Con il solo `127.0.0.1` quell'indirizzo non risponde al TCP, e la prova
    # fallisce prima di arrivare al TLS: il test riceve `Io` — nessuno in
    # ascolto — invece del rifiuto del certificato che deve misurare.
    #
    # E' successo davvero: legare la porta al solo `127.0.0.1` ha chiuso una
    # esposizione vera e rotto quella prova nello stesso commit. Restano
    # entrambi di loopback, quindi `127.0.0.0/8` non lascia la macchina e la
    # ragione della prima riga vale identica per la seconda.
    ports:
      - "127.0.0.1:1433:1433"
      - "127.0.0.2:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_tls:/var/opt/mssql/tls:ro
      - ./docker/sqlserver/tls/mssql.conf:/var/opt/mssql/mssql.conf:ro
    depends_on:
      sqlserver-certgen:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - sqlserver-hostname-mismatch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    container_name: dataflow-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "DataFlow_Test_2026!"
    volumes:
      - ./docker/sqlserver/init:/init:ro
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        for script in /init/*.sql; do
          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" \
            -d master -C -b -i "$$script"
        done
    restart: "no"

volumes:
  sqlserver_data:
  sqlserver_tls:
