services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    container_name: dataflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataFlow_Test_2026!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    container_name: dataflow-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "DataFlow_Test_2026!"
    volumes:
      - ./docker/sqlserver/init:/init:ro
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        for script in /init/*.sql; do
          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" \
            -d master -C -b -i "$$script"
        done
    restart: "no"

volumes:
  sqlserver_data:
