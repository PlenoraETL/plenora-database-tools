; PgBouncer del riferimento PostgreSQL: contratto L-DB1 della connessione
; prestata (docs/connessione-prestata.md). Due connessioni server per quattro
; client della prova: le istruzioni nominate passano fra backend diversi.
[databases]
dataflow_test = host=dataflow-postgres port=5432 dbname=dataflow_test pool_size=2

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = dataflow
pool_mode = transaction
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits
