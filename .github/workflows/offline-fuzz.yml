name: Offline contract fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/offline-fuzz.yml"
      - "fuzz/**"
      - "crates/plenora-database-core/**"
      - "crates/plenora-database-sql/**"
      - "crates/plenora-database-engine/**"
      - "crates/plenora-db-postgres/src/connection.rs"
      - "crates/plenora-db-sqlserver/src/types.rs"
      - "crates/plenora-db-sqlserver/src/recovery.rs"
      - "crates/plenora-db-sqlserver/src/catalog/**"
      - "crates/plenora-db-mysql/src/types.rs"
      - "crates/plenora-db-mysql/src/query.rs"
      - "crates/plenora-db-mysql/src/catalog.rs"
  schedule:
    - cron: "53 2 * * 4"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Bounded campaign duration in seconds"
        required: true
        default: "600"
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: offline-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-surfaces:
    name: ${{ matrix.target }} / libFuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `ewkb_parser` resta governato dal proprio workflow: qui ci sono solo
        # le superfici aggiunte oltre il parser EWKB.
        #
        # `max_len` è per target: il costo di `postgres_tls_pem` cresce più che
        # linearmente con la dimensione del PEM (tre parsing completi per
        # esecuzione), quindi oltre pochi kB la campagna rallenta senza
        # guadagnare copertura.
        include:
          - target: plan_contract
            max_len: 65536
          - target: field_contract
            max_len: 65536
          - target: query_ast_render
            max_len: 65536
          - target: sql_select_render
            max_len: 65536
          - target: mysql_read_plan
            max_len: 65536
          - target: mysql_query_render
            max_len: 65536
          - target: sqlserver_read_plan
            max_len: 65536
          - target: sqlserver_recovery
            max_len: 65536
          - target: postgres_tls_pem
            max_len: 8192
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-27
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Install the pinned fuzzing toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" cargo install \
            cargo-fuzz --version 0.13.2 --locked

      # actions/cache v5, resolved to an exact revision on 2026-07-28.
      - name: Restore the evolving corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: offline-fuzz-${{ matrix.target }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: offline-fuzz-${{ matrix.target }}-${{ runner.os }}-

      # Il grafo del progetto fuzz deve restare risolvibile senza
      # aggiornamenti impliciti, altrimenti la campagna non descrive il
      # candidato.
      - name: Verify the locked fuzz dependency graph
        run: |
          cargo metadata \
            --manifest-path fuzz/Cargo.toml \
            --locked \
            --format-version 1 > /dev/null

      - name: Record the execution environment
        run: |
          mkdir -p \
            assurance-results \
            "fuzz/artifacts/${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}"
          {
            printf 'commit=%s\n' "$CANDIDATE_SHA"
            printf 'target=%s\n' "${{ matrix.target }}"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'campaign_seconds=%s\n' "$FUZZ_SECONDS"
            printf 'max_len=%s\n' "${{ matrix.max_len }}"
            rustup run "$RUSTUP_TOOLCHAIN" rustc --version --verbose
            cargo fuzz --version
          } | tee "assurance-results/offline-fuzz-${{ matrix.target }}-environment.txt"

      - name: Run the bounded campaign
        working-directory: fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- \
            -max_total_time="$FUZZ_SECONDS" \
            -artifact_prefix="artifacts/${{ matrix.target }}/" \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -max_len=${{ matrix.max_len }} 2>&1 |
            tee "../assurance-results/offline-fuzz-${{ matrix.target }}.log"

      - name: Record the resulting corpus
        if: always()
        run: |
          find "fuzz/corpus/${{ matrix.target }}" -type f -print0 |
            sort -z |
            xargs -0 -r sha256sum \
              > "assurance-results/offline-fuzz-${{ matrix.target }}-corpus-sha256.txt"
          find "fuzz/artifacts/${{ matrix.target }}" -type f -print0 |
            sort -z |
            xargs -0 -r sha256sum \
              > "assurance-results/offline-fuzz-${{ matrix.target }}-findings-sha256.txt"

      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code

      - name: Preserve fuzzing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-fuzz-${{ matrix.target }}-${{ env.CANDIDATE_SHA }}
          path: |
            assurance-results/
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 90
