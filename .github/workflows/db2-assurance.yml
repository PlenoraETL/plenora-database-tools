name: db2-assurance

# MISURA TEMPORANEA 8.0.4: solo ramo misura/804. Il passo del gate e
# sostituito dalla sola esecuzione dei test misura_804.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  db2-linux:
    name: misura 804 Db2 12.1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build e avvio del riferimento
        run: |
          docker compose -f docker-compose.db2.yml config --quiet
          docker compose -f docker-compose.db2.yml up -d --build --wait --wait-timeout 900
      - name: misura 804 Rust
        run: |
          docker compose -f docker-compose.db2.yml exec -T \
            -e PLENORA_DB2_HOST=127.0.0.1 -e PLENORA_DB2_DATABASE=plenora \
            -e PLENORA_DB2_USER=db2inst1 -e PLENORA_DB2_PASSWORD=plenora_test \
            db2 cargo test --locked -p plenora-db-db2 --lib misura_804 \
            -- --ignored --nocapture --test-threads=1
      - name: misura 804 SDK
        if: always()
        run: |
          docker compose -f docker-compose.db2.yml exec -T \
            -e PLENORA_TEST_DB2_HOST=127.0.0.1 -e PLENORA_TEST_DB2_DATABASE=plenora \
            -e PLENORA_TEST_DB2_USER=db2inst1 -e PLENORA_TEST_DB2_PASSWORD=plenora_test \
            -e PLENORA_TEST_DB2_PORT=50000 -e PLENORA_TEST_DB2_TLS_MODE=insecure_local \
            db2 sh -lc 'rm -rf /tmp/mis804 && mkdir -p /tmp/mis804/misura_tests && cp -R /workspace/crates/plenora-database-py/python/tests/. /tmp/mis804/misura_tests/ && cd /tmp && python3.12 /workspace/scripts/misura_804_sdk_db2.py'
      - name: ferma il riferimento
        if: always()
        run: docker compose -f docker-compose.db2.yml down --volumes || true
