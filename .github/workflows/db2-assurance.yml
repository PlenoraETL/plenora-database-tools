name: db2-assurance

# Verifica build-only della feature Db2 su Windows.
# La qualifica live Linux vive in db2-assurance-long.yml.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".python-version"
      - "scripts/install_python.sh"
      - "scripts/check_python_version.py"
      - "requirements-*.txt"
      - ".github/workflows/db2-assurance.yml"
      - ".github/scripts/verify_wheel.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/plenora-database-core/**"
      - "crates/plenora-database-cli/**"
      - "crates/plenora-database-py/**"
      - "crates/plenora-db-db2/**"
      - "vendor/odbc-api/**"
      - "docker-compose.db2.yml"
      - "docker/db2-client/**"
      - "scripts/check_db2_reference.py"
      - "scripts/test_check_db2_reference.py"
      - "scripts/name_db2_wheel.py"
      - "scripts/test_name_db2_wheel.py"
      - "scripts/live_inventory.py"
      - "requirements-sdk-build.txt"
      - "requirements-sdk-tests.txt"
      - "requirements-self-tests.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db2-assurance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  db2-windows-build:
    name: Db2 feature Windows x86_64 (build-only)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build del wheel con feature DB2
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.16.0'
          command: build
          args: >-
            --release
            --locked
            --features db2
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
          rust-toolchain: '1.98.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: caricamento e profilo della feature DB2
        shell: bash
        env:
          PLENORA_EXPECT_DB2_RUNTIME: '1'
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
