name: session-matrix

# Campagna live della semantica di sessione sui tre riferimenti.
#
# La matrice in `docs/mariadb/SESSION-MATRIX.md` giustifica una decisione
# architetturale: bootstrap, isolamento e `START TRANSACTION` restano codice
# condiviso perche MySQL 9.7 e le due MariaDB si comportano allo stesso modo.
# Il self-test statico gira su ogni PR e verifica il **giudizio** del runner;
# non puo accorgersi che il comportamento e cambiato, perche non tocca un
# server. Se domani cambiasse `SESSION_BOOTSTRAP_SQL`, il documento resterebbe
# quello di ieri e la CI resterebbe verde.
#
# Questa campagna e cio che chiude quel buco. Non gira su push: accende tre
# server e ne misura tredici superfici, che e troppo per ogni commit e
# inutile per la maggior parte. Gira a cadenza fissa — dove scopre una
# divergenza introdotta da un cambio del codice o da un aggiornamento
# dell'immagine — e a mano, quando qualcuno tocca la sessione e vuole saperlo
# prima della review.
#
# Il ciclo di vita delle fixture non e qui: sta in
# `scripts/check_session_campaign.py`, che si esegue identico in locale. Uno
# YAML che accende container e una decisione senza test.

on:
  schedule:
    # Lunedi mattina: la settimana comincia sapendo se la matrice regge.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Sola lettura: la campagna misura, non scrive sul repository.
permissions:
  contents: read

concurrency:
  group: session-matrix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  session-matrix:
    name: matrice della semantica di sessione
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Un gate Python installa le proprie dipendenze prima di girare. Senza,
      # basta che uno degli script importi qualcosa che ne dipenda — anche
      # indirettamente, come `render_state` che importa `phase0_validate` —
      # perche il job fallisca all'import invece che su una verifica.
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt

      - name: self-test del runner
        run: python3 scripts/test_check_session_matrix.py

      # Log e diagnostica vivono **fuori** dal repository. Scriverli dentro
      # sporcherebbe l'albero, e il preflight della campagna — che pretende
      # un albero pulito — rifiuterebbe proprio quel file: un gate che non
      # puo passare per costruzione.
      # Preparazione, non misura: un passo suo, perche il gate deve essere
      # il primo comando del proprio `run`.
      - name: directory di diagnostica
        run: mkdir -p "$RUNNER_TEMP/session-matrix"

      - name: campagna live sui tre riferimenti
        run: |
          python3 scripts/check_session_campaign.py \
            --diagnostics "$RUNNER_TEMP/session-matrix" 2>&1 \
            | tee "$RUNNER_TEMP/session-matrix/session-matrix.log"

      # Il documento rigenerato deve coincidere con quello committato: se
      # differisce, il comportamento misurato non e piu quello su cui la
      # decisione poggia, e va riletto prima di aggiornare il file.
      - name: la matrice registrata e ancora quella osservata
        run: git diff --exit-code -- docs/mariadb/SESSION-MATRIX.md

      - name: diagnostica
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-matrix-results
          path: ${{ runner.temp }}/session-matrix/
          retention-days: 7
