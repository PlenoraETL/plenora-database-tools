name: postgres-matrix

# Matrice delle major PostgreSQL supportate, da 14 a 18, ciascuna con la
# propria immagine PostGIS fissata per digest.
#
# Vive separata da `postgres-assurance.yml`: avviare sequenzialmente l'intera
# matrice supera il budget del gate eseguito sui cambi del provider. I trigger
# rendono esplicita la frequenza della prova completa.
#
# Questo file non contiene logica di qualifica: una invocazione, niente altro.
# Digest, versioni attese e pulizia delle risorse vivono nello script, che e
# anche il modo in cui la matrice si riproduce in locale con lo stesso comando.

on:
  schedule:
    # Lunedi 04:17 UTC, un'ora dopo `mysql-assurance`: le campagne pesanti non
    # si accavallano sulla stessa finestra, e i pull da Docker Hub restano
    # distanziati.
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # La matrice presidia anche se stessa: una modifica allo script o a questo
  # file va provata dove viene scritta, non alla schedulazione successiva.
  pull_request:
    paths:
      - ".github/workflows/postgres-matrix.yml"
      - "scripts/check_postgres_matrix.py"

permissions:
  contents: read

concurrency:
  group: postgres-matrix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  matrix:
    name: matrice major PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Un gate Python installa le proprie dipendenze prima di girare. Senza,
      # basta che uno degli script importi qualcosa che ne dipenda — anche
      # indirettamente — perche il job fallisca all'import invece che su una
      # verifica.
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: check_postgres_matrix.py
        run: python3 scripts/check_postgres_matrix.py | tee postgres-version-matrix.log
      - name: verdetto
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-version-matrix
          path: postgres-version-matrix.log
          if-no-files-found: error
