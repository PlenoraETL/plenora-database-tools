name: supply-chain

# Applica la policy di `deny.toml` a `Cargo.lock` e al lock separato di
# `fuzz/`. Il primo comprende anche tiberius, mysql_async e pyo3, che
# `default-members` esclude dal build ma non dalla risoluzione. La superficie
# da controllare e quella che il repository dichiara, non quella che
# `cargo build` tocca per default.
#
# Gira anche a calendario perche il rischio qui non arriva da un commit: una
# advisory pubblicata domani riguarda il codice fermo di oggi, e senza corsa
# schedulata resterebbe invisibile fino alla PR successiva.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunedi 05:17 UTC. Minuto non tondo: gli orari tondi sono i piu
    # congestionati su Actions e le corse schedulate vengono rimandate.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      # Stesso tool, versione e comando usati in locale. `advisories` dipende
      # dal database RustSec e puo diventare rosso senza modifiche al commit;
      # licenses, bans e sources dipendono invece dal lockfile e da deny.toml.
      - name: Check advisories, licenses, bans and sources
        run: python scripts/check_cargo_deny.py
