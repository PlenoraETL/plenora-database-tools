name: mysql-assurance

# Gate del riferimento MySQL baseline; la matrice completa vive in mysql-assurance-long.yml.

on:
  schedule:
    # Lunedi 03:17 UTC: fuori dai minuti di punta, dove la coda dei runner
    # condivisi e piu corta.
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Sola lettura: la campagna non scrive sul repository. Gli artifact non
# richiedono permessi aggiuntivi sul token.
permissions:
  contents: read

concurrency:
  group: mysql-assurance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  reference:
    name: gate riferimento baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # Un gate Python installa le proprie dipendenze prima di girare. Senza,
      # basta che uno degli script importi qualcosa che ne dipenda — anche
      # indirettamente, come `render_state` che importa `phase0_validate` —
      # perche il job fallisca all'import invece che su una verifica.
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: check_mysql_reference.py
        run: python3 scripts/check_mysql_reference.py | tee mysql-reference.log
      - name: verdetto
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-reference
          path: mysql-reference.log
          if-no-files-found: error
