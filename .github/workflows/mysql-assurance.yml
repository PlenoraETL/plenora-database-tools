name: mysql-assurance

# MISURA TEMPORANEA 8.0.4: solo ramo misura/804. Il passo del gate e
# sostituito dalla sola esecuzione dei test misura_804.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  reference:
    name: misura 804 MySQL baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: misura 804
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from scripts import check_mysql_reference as g
          g.ensure_reference_running()
          print(g.validate_reference())
          g.run_cargo(["test", "-p", "plenora-db-mysql", "--lib", "misura_804", "--locked",
                       "--", "--ignored", "--nocapture", "--test-threads=1"])
          PY
