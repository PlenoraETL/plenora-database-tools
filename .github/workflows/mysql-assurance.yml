name: MySQL assurance

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/mysql-assurance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/plenora-database-core/**"
      - "crates/plenora-database-sql/**"
      - "crates/plenora-database-testkit/**"
      - "crates/plenora-db-mysql/**"
      - "docker-compose.mysql.yml"
      - "docker/mysql/init/**"
      - "scripts/check_mysql_reference.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mysql:
    name: MySQL 8.4 reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      PLENORA_MYSQL_GATE_HOST_CARGO: "1"
      PLENORA_MYSQL_HOST: 127.0.0.1
      PLENORA_MYSQL_DATABASE: dataflow_test
      PLENORA_MYSQL_USER: dataflow
      PLENORA_MYSQL_PASSWORD: DataFlow_Test_2026!

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate and start the pinned reference
        run: |
          mkdir -p assurance-results
          docker compose -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.mysql.yml up -d --wait

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt

      - name: Run the MySQL reference gate
        run: |
          python3 scripts/check_mysql_reference.py 2>&1 \
            | tee assurance-results/mysql-reference.log

      - name: Record reproducibility identities
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            rustc --version --verbose
            cargo --version --verbose
            docker --version
            docker compose version
            docker image inspect \
              mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb \
              --format '{{.Id}} {{json .RepoDigests}}'
          } | tee assurance-results/mysql-environment.txt

      - name: Verify the candidate remained unchanged
        run: git diff --exit-code -- .

      - name: Capture diagnostics
        if: failure()
        run: |
          docker ps -a > assurance-results/mysql-containers.txt
          docker compose -f docker-compose.mysql.yml logs --no-color \
            > assurance-results/mysql-compose.log 2>&1 || true

      - name: Preserve assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mysql-assurance-${{ github.sha }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90

      - name: Stop MySQL and remove ephemeral volumes
        if: always()
        run: docker compose -f docker-compose.mysql.yml down --volumes || true
