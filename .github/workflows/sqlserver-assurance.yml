name: sqlserver-assurance

# Campagna SQL Server: gate del riferimento 2022 e budget di performance.
#
# Questo file non contiene logica di qualifica. Versioni, digest, inventario
# dei test live, materiale TLS e verdetto vivono negli script, che sono anche
# il modo in cui la campagna si riproduce in locale con lo stesso comando.
#
# La pulizia non usa `--remove-orphans`: ogni Compose ha un progetto proprio e
# il comando deve restare sicuro anche quando viene riprodotto in locale con
# altri riferimenti attivi.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/sqlserver-assurance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/plenora-database-cli/**"
      - "crates/plenora-database-core/**"
      - "crates/plenora-database-engine/**"
      - "crates/plenora-database-sql/**"
      - "crates/plenora-database-testkit/**"
      - "crates/plenora-db-sqlserver/**"
      - "docker-compose.sqlserver.yml"
      - "docker/sqlserver/init/**"
      - "docker/sqlserver/tls/**"
      - "scripts/check_sqlserver_reference.py"
      - "scripts/test_check_sqlserver_reference.py"
      - "scripts/check_sqlserver_performance.py"
      # Dipendenze eseguite o importate direttamente dal gate.
      - "scripts/live_inventory.py"
      - "tests/test_sqlserver_performance.py"
      - "scripts/compose_network.py"
      - "benchmarks/manifests/sqlserver-performance-reference.json"
      - "benchmarks/baseline/sqlserver-performance-budget.json"
      - "benchmarks/baseline/sqlserver2022-performance-reference.json"
  workflow_dispatch:

# Sola lettura: la campagna non scrive sul repository.
permissions:
  contents: read

concurrency:
  group: sqlserver-assurance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  sqlserver:
    name: gate riferimento SQL Server 2022
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      PLENORA_SQLSERVER_GATE_HOST_CARGO: "1"
      PLENORA_SQLSERVER_HOST: 127.0.0.1
      PLENORA_SQLSERVER_DATABASE: dataflow_test
      PLENORA_SQLSERVER_USER: dataflow
      PLENORA_SQLSERVER_PASSWORD: DataFlow_Test_2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Un gate Python installa le proprie dipendenze prima di girare. Senza,
      # basta che uno degli script importi qualcosa che ne dipenda — anche
      # indirettamente, come `render_state` che importa `phase0_validate` —
      # perche il job fallisca all'import invece che su una verifica.
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt

      - name: self-test del gate
        run: python3 scripts/test_check_sqlserver_reference.py

      - name: avvia il riferimento
        run: |
          mkdir -p assurance-results
          docker compose -f docker-compose.sqlserver.yml config --quiet
          docker compose -f docker-compose.sqlserver.yml up -d --wait
          test "$(docker wait dataflow-sqlserver-init)" = "0"

      - name: toolchain Rust pinned
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

      - name: check_sqlserver_reference.py
        run: |
          python3 scripts/check_sqlserver_reference.py 2>&1 \
            | tee assurance-results/sqlserver-reference.log

      # Il self-test del gate in un passo suo: un suo rosso e un difetto
      # della guardia, non della misura, e i due vanno distinti nel
      # verdetto. Serve anche a lasciare il gate come primo comando del
      # proprio `run`.
      - name: self-test del gate prestazionale
        run: python3 -m unittest tests.test_sqlserver_performance

      - name: check_sqlserver_performance.py
        run: |
          python3 scripts/check_sqlserver_performance.py \
            --baseline benchmarks/baseline/sqlserver2022-performance-reference.json \
            --output assurance-results/sqlserver-performance.json 2>&1 \
            | tee assurance-results/sqlserver-performance.log

      # `git status --porcelain=v1 -uall` copre modifiche tracciate e file
      # nuovi. Gli artefatti del gate sono esclusi tramite `.gitignore`.
      - name: il candidato non e cambiato
        run: |
          residuo="$(git status --porcelain=v1 -uall)"
          if [ -n "$residuo" ]; then
            echo "::error::il gate ha lasciato modifiche o file nuovi nel worktree"
            printf '%s\n' "$residuo"
            git diff -- . || true
            exit 1
          fi

      - name: diagnostica
        if: failure()
        run: |
          docker ps -a > assurance-results/sqlserver-containers.txt
          docker compose -f docker-compose.sqlserver.yml logs --no-color \
            > assurance-results/sqlserver-compose.log 2>&1 || true

      - name: verdetto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlserver-assurance-${{ github.sha }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90

      - name: ferma il riferimento
        if: always()
        run: docker compose -f docker-compose.sqlserver.yml down --volumes || true
