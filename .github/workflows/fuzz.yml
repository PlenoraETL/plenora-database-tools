name: fuzz

# Campagne dei target di `fuzz/`: un job per target, su Linux, partendo dai
# semi versionati in `fuzz/seeds/<target>/`. Il corpus che la campagna fa
# crescere resta in `fuzz/corpus/` (ignorato da Git) e non torna nel
# repository.
#
# Durata: un minuto a target sulle PR che toccano `fuzz/` o questo workflow,
# dieci minuti ogni domenica e a mano. Le PR che toccano solo il codice
# fuzzato non lanciano la campagna: i target dipendono da core, engine, sql e
# tre adapter, cioe da quasi ogni PR, e dieci build nightly con sanitizer per
# PR costerebbero piu di quanto aggiunge un minuto di fuzzing. Le compila
# comunque `rust-ci` (`cargo check --manifest-path fuzz/Cargo.toml`), e la
# corsa settimanale esercita il codice di `main`.
#
# Un crash, un timeout o un'uscita non nulla fanno fallire il job; i reperti
# restano come artefatto della corsa.

on:
  pull_request:
    branches: [main]
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Domenica 04:23 UTC. Minuto non tondo, come supply-chain.yml.
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: secondi per target
        required: false
        default: '600'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # La stessa nightly di fuzz/README.md: libFuzzer e i sanitizer richiedono
  # una nightly, fissata per data perche la campagna sia ripetibile.
  NIGHTLY: nightly-2026-07-27

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - ewkb_parser
          - plan_contract
          - field_contract
          - query_ast_render
          - sql_select_render
          - mysql_read_plan
          - mysql_query_render
          - sqlserver_read_plan
          - sqlserver_recovery
          - postgres_tls_pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup e preinstallato sui runner Ubuntu. Non si usa
      # dtolnay/rust-toolchain: nel repository e pinnata sulla toolchain
      # stabile, e qui serve la nightly datata.
      - name: Rust nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - name: cargo-fuzz 0.13.2
        run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: campagna
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || github.event.inputs.seconds || '600' }}
        run: |
          extra=""
          if [ "$TARGET" = postgres_tls_pem ]; then
            # Vedi fuzz/README.md: il costo cresce piu che linearmente con
            # la dimensione del PEM.
            extra="-max_len=8192"
          fi
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/artifacts/$TARGET"
          cp fuzz/seeds/"$TARGET"/* "fuzz/corpus/$TARGET/"
          # shellcheck disable=SC2086  # `extra` e vuoto o un solo argomento
          cargo +"$NIGHTLY" fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=30 \
            -artifact_prefix="fuzz/artifacts/$TARGET/" -print_final_stats=1 $extra
      - name: reperti
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
