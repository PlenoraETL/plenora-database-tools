name: Release manifest

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/**"
      - "release/**"
      - "scripts/check_release_manifest.py"
      - "scripts/test_check_release_manifest.py"
      - "scripts/check_rc1_readiness.py"
      - "scripts/test_check_rc1_readiness.py"
      - "scripts/check_final_readiness.py"
      - "scripts/test_check_final_readiness.py"
      - "scripts/test_candidate_sha_workflows.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  release-manifest:
    name: Release manifest / C1-C4 / RC1 + final readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove all assurance workflows bind to the candidate SHA
        run: python3 scripts/test_candidate_sha_workflows.py

      - name: Validate the release manifest
        run: |
          python3 scripts/check_release_manifest.py \
            --repo . \
            --json-out "$RUNNER_TEMP/release-manifest-result.json" \
            release/development.json \
            release/rc1-readiness.json \
            release/final-readiness.json

      - name: Prove the gate rejects invalid manifests
        run: python3 scripts/test_check_release_manifest.py

      - name: Validate the RC1 release state
        run: |
          python3 scripts/check_rc1_readiness.py \
            --repo . \
            --json-out "$RUNNER_TEMP/rc1-readiness-result.json" \
            release/rc1-readiness.json

      - name: Prove the RC1 gate rejects unsafe mutations
        run: python3 scripts/test_check_rc1_readiness.py

      - name: Validate the final 1.0.0 metadata candidate
        run: |
          python3 scripts/check_final_readiness.py \
            --repo . \
            --json-out "$RUNNER_TEMP/final-readiness-result.json" \
            release/final-readiness.json

      - name: Prove the final gate rejects premature claims
        run: python3 scripts/test_check_final_readiness.py

      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code -- .

      - name: Preserve the machine-readable result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-manifest-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/release-manifest-result.json
            ${{ runner.temp }}/rc1-readiness-result.json
            ${{ runner.temp }}/final-readiness-result.json
          if-no-files-found: error
          retention-days: 30
