name: python-wheel

# Builda wheel abi3-py310 standard per Linux (manylinux_2_34) e Windows
# (x86_64), piu il wheel runtime Db2 Linux x86_64 con build tag `1db2`.
# Un unico wheel per piattaforma copre Python >= 3.10. La rimozione della
# distribuzione macOS ARM e incompatibile e appartiene alla major 1.0.
#
# Ogni job di build installa e verifica il proprio wheel **prima**
# dell'upload: un artefatto rotto non deve nemmeno diventare scaricabile,
# e il caricamento del modulo nativo si prova solo sulla piattaforma che
# lo ha compilato. Le verifiche standard stanno in
# `.github/scripts/verify_wheel.py`, una sola volta.
#
# Sull'evento `release` allega wheel, SBOM e attestazioni alla release GitHub.
# GitHub Releases e l'unica superficie di distribuzione: il workflow non
# pubblica su package index esterni e non richiede token di pubblicazione.
#
# Triggers:
#   - `workflow_dispatch` (manuale): preflight. Produce artifact scaricabili
#     dalla UI Actions, senza toccare release o tag.
#   - `release` (published): produce gli stessi wheel e li allega alla
#     release GitHub. Su questo evento il wheel deve corrispondere al tag.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ---------------- Linux (manylinux_2_34) ----------------
  linux:
    name: build linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheel (manylinux_2_34)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          # L'action e maturin sono dipendenze distinte e vanno fissate entrambe.
          maturin-version: '1.14.1'
          command: build
          args: >-
            --release
            --locked
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
          manylinux: 2_34
          rust-toolchain: '1.98.0'
      - name: Build CLI and qualify the Rust mapping
        shell: bash
        run: |
          cargo build --release --locked -p plenora-database-cli
          cargo test --locked -p plenora-database-core --test public_rust_surface_v1
          cp target/release/plenora-database dist/plenora-database-linux-x86_64
          version="$(grep '^version = ' crates/plenora-database-py/pyproject.toml | head -n1 | cut -d'"' -f2)"
          git archive --format=tar.gz \
            --prefix="plenora-database-tools-${version}/" \
            --output="dist/plenora-database-tools-${version}-source.tar.gz" \
            HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-x86_64
          path: |
            dist/*.whl
            dist/*-source.tar.gz
            dist/plenora-database-linux-x86_64

  # ---------------- Windows (x86_64) ----------------
  windows:
    name: build windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          # L'action e maturin sono dipendenze distinte e vanno fissate entrambe.
          maturin-version: '1.14.1'
          command: build
          args: >-
            --release
            --locked
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
          rust-toolchain: '1.98.0'
      - name: Build CLI
        shell: pwsh
        run: |
          cargo build --release --locked -p plenora-database-cli
          Copy-Item -LiteralPath target\release\plenora-database.exe -Destination dist\plenora-database-windows-x86_64.exe
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-x86_64
          path: |
            dist/*.whl
            dist/plenora-database-windows-x86_64.exe

  # ---------------- Db2 runtime (Linux x86_64) ----------------
  # Questo non e il wheel standard: usa il client IBM del fixture e porta il
  # build tag PEP 427 `1db2`. Viene esportato solo dopo la qualifica live.
  db2-linux:
    name: build and qualify db2-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Dipendenze del gate
        run: python -m pip install -r requirements-self-tests.txt
      - name: Self-test del gate
        run: |
          python scripts/test_name_db2_wheel.py
          python scripts/test_check_db2_reference.py
      - name: Build del riferimento Db2 e del wheel
        run: |
          mkdir -p assurance-results "$RUNNER_TEMP/db2-dist"
          docker compose -f docker-compose.db2.yml config --quiet
          docker compose -f docker-compose.db2.yml up -d --build --wait --wait-timeout 900
      - name: Qualifica live prima della distribuzione
        run: |
          python scripts/check_db2_reference.py 2>&1 \
            | tee assurance-results/db2-reference.log
      - name: Esporta e verifica il nome dell'artefatto qualificato
        run: |
          docker compose -f docker-compose.db2.yml cp \
            db2:/opt/plenora-wheel/. "$RUNNER_TEMP/db2-dist/"
          python scripts/name_db2_wheel.py --check "$RUNNER_TEMP/db2-dist"
      - name: Il candidato non e cambiato
        run: test -z "$(git status --porcelain=v1 -uall)"
      - name: Diagnostica
        if: failure()
        run: |
          docker ps -a > assurance-results/db2-containers.txt
          docker compose -f docker-compose.db2.yml logs --no-color \
            > assurance-results/db2-compose.log 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-db2-linux-x86_64
          path: ${{ runner.temp }}/db2-dist/*-1db2-cp310-abi3-linux_x86_64.whl
          if-no-files-found: error
      - name: Ferma il riferimento
        if: always()
        run: docker compose -f docker-compose.db2.yml down --volumes || true

  # ---------------- Smoke test ----------------
  # Verifica l'artefatto dopo upload/download, nella stessa forma ricevuta da
  # chi lo scarica, riusando la definizione comune di wheel valido.
  smoke-test:
    name: smoke-test linux wheel
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh

  # ---------------- Python ABI3 runtime matrix ----------------
  # Il type checking multipiattaforma non prova che il modulo nativo si
  # carichi davvero su ogni interprete dichiarato. Scarichiamo gli stessi
  # wheel gia costruiti e li importiamo, senza risolvere dipendenze di test
  # che hanno una matrice Python distinta dall'ABI pubblica del pacchetto.
  abi3-runtime:
    name: abi3 runtime ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: [linux, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: windows-latest
            artifact: wheel-windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Importa e verifica il wheel scaricato
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python .github/scripts/verify_wheel.py

  # ---------------- Provenance + GitHub Release ----------------
  attach-to-release:
    name: attest and attach release materials
    needs: [linux, windows, db2-linux, smoke-test, abi3-runtime]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutabile plenora-contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlenoraETL/plenora-contracts
          ref: 5d151078142e7ed49d831659ee8be92a4975f80b
          path: .plenora-contracts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List collected release artifacts
        run: ls -la dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install contract gate dependencies
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: Validate the released CLI against the immutable contract pin
        run: |
          chmod +x dist/plenora-database-linux-x86_64
          python3 scripts/check_public_contracts.py \
            --contracts .plenora-contracts \
            --cli dist/plenora-database-linux-x86_64
      - name: Generate the immutable adoption manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#py-v}"
          artifacts=()
          for path in dist/*.whl; do
            artifacts+=(--artifact "$(basename "$path")|python_sdk|$path|sync,async")
          done
          artifacts+=(--artifact "plenora-database-linux-x86_64|cli|dist/plenora-database-linux-x86_64")
          artifacts+=(--artifact "plenora-database-windows-x86_64.exe|cli|dist/plenora-database-windows-x86_64.exe")
          source="$(find dist -maxdepth 1 -name 'plenora-database-tools-*-source.tar.gz' -print -quit)"
          artifacts+=(--artifact "$(basename "$source")|rust|$source")
          python3 scripts/render_adoption_manifest.py \
            --version "$version" \
            "${artifacts[@]}" \
            --verification "python3 scripts/check_public_contracts.py --contracts .plenora-contracts --cli dist/plenora-database-linux-x86_64" \
            --verification "cargo test --locked -p plenora-database-core --test public_rust_surface_v1" \
            --verification "bash .github/scripts/offline_suite.sh" \
            --schema .plenora-contracts/schemas/adoption-manifest-v4.schema.json \
            --output dist/plenora-database-${version}.adoption-manifest.json
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          output-file: dist/plenora-database-${{ github.event.release.tag_name }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest wheel build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/plenora-database-linux-x86_64
            dist/plenora-database-windows-x86_64.exe
            dist/*-source.tar.gz
      - name: Attest the release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            dist/*.whl
            dist/plenora-database-linux-x86_64
            dist/plenora-database-windows-x86_64.exe
            dist/*-source.tar.gz
          sbom-path: dist/plenora-database-${{ github.event.release.tag_name }}.sbom.cdx.json
      - name: Upload release artifacts, adoption manifest and SBOM
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
