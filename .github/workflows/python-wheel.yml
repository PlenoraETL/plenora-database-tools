name: python-wheel

# Builda wheel abi3-py310 per Linux (manylinux_2_34), macOS (arm64) e
# Windows (x86_64). Un unico wheel per platform copre Python >= 3.10.
# macOS produce solo l'artefatto ARM; il job documenta il comando per la build
# Intel, che resta fuori da questa matrice.
#
# Ogni job di build installa e verifica il proprio wheel **prima**
# dell'upload: un artefatto rotto non deve nemmeno diventare scaricabile,
# e il caricamento del modulo nativo si prova solo sulla piattaforma che
# lo ha compilato. Le tre verifiche stanno in
# `.github/scripts/verify_wheel.py`, una sola volta.
#
# Il workflow non pubblica su un package index: costruisce e verifica artifact
# e, sull'evento `release`, li allega alla release GitHub. Non possiede token
# per PyPI.
#
# Triggers:
#   - `workflow_dispatch` (manuale): preflight. Produce artifact scaricabili
#     dalla UI Actions, senza toccare release o tag.
#   - `release` (published): produce gli stessi wheel e li allega alla
#     release GitHub. Su questo evento il wheel deve corrispondere al tag.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ---------------- Linux (manylinux_2_34) ----------------
  linux:
    name: build linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build wheel (manylinux_2_34)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          # L'action e maturin sono dipendenze distinte e vanno fissate entrambe.
          maturin-version: '1.14.1'
          command: build
          args: >-
            --release
            --locked
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
          manylinux: 2_34
          rust-toolchain: '1.92.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  # ---------------- macOS (arm64 only) ----------------
  # La matrice distribuisce solo ARM. Per Intel usare localmente
  # `maturin build --target x86_64-apple-darwin`.
  macos:
    name: build macos-aarch64
    runs-on: macos-latest       # runner ARM (M1/M2)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build wheel (aarch64)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          # L'action e maturin sono dipendenze distinte e vanno fissate entrambe.
          maturin-version: '1.14.1'
          command: build
          args: >-
            --release
            --locked
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
            --target aarch64-apple-darwin
          rust-toolchain: '1.92.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-macos-aarch64
          path: dist/*.whl

  # ---------------- Windows (x86_64) ----------------
  windows:
    name: build windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          # L'action e maturin sono dipendenze distinte e vanno fissate entrambe.
          maturin-version: '1.14.1'
          command: build
          args: >-
            --release
            --locked
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
          rust-toolchain: '1.92.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------- Smoke test ----------------
  # Verifica l'artefatto dopo upload/download, nella stessa forma ricevuta da
  # chi lo scarica, riusando la definizione comune di wheel valido.
  smoke-test:
    name: smoke-test linux wheel
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/scripts/verify_wheel.py
      # Dopo l'import, la suite offline verifica il comportamento:
      # esercita parametri tipizzati, Arrow, AST portable e spatial senza
      # bisogno di un server; i test live si saltano da soli.
      - name: Offline SDK suite
        shell: bash
        run: bash .github/scripts/offline_suite.sh

  # ---------------- Attach to GitHub Release ----------------
  # Solo su release publish: scarica tutti i wheel e li allega alla
  # release corrente. E l'unica consegna che questo workflow fa: da li
  # i wheel si distribuiscono a mano.
  attach-to-release:
    name: attach wheels to release
    needs: [linux, macos, windows, smoke-test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: List collected wheels
        run: ls -la dist/
      - name: Upload wheels to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.whl
