name: oracle-assurance

# MISURA TEMPORANEA 8.0.4: solo ramo misura/804. Il passo del gate e
# sostituito dalla sola esecuzione dei test misura_804.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  oracle-linux:
    name: misura 804 Oracle 26ai
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: toolchain Rust pinned
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: avvia il riferimento
        run: |
          docker compose -f docker-compose.oracle.yml config --quiet
          docker compose -f docker-compose.oracle.yml up -d --wait --wait-timeout 600
      - name: misura 804
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from scripts import check_oracle_reference as g
          reference = g.reference_contract()
          container = g.container_identity(reference)
          rust, _python = g.test_environments(reference, container["container_id"])
          g.run(["cargo", "test", "--locked", "-p", "plenora-db-oracle", "--lib", "misura_804",
                 "--", "--ignored", "--nocapture", "--test-threads=1"], environment=rust)
          PY
      - name: ferma il riferimento
        if: always()
        run: docker compose -f docker-compose.oracle.yml down --volumes || true
