name: mariadb-evidence

# MISURA TEMPORANEA 8.0.4: solo ramo misura/804. Il passo del gate e
# sostituito dalla sola esecuzione dei test misura_804.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  mariadb-evidence:
    name: misura 804 MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: misura 804
        run: python3 scripts/misura_804_mariadb.py
