name: coverage

# Coverage offline e riproducibile. I test live restano nei workflow dei
# provider: un report senza il relativo fixture non puo attribuirsi quella
# prova.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-product:
    name: prodotto Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Dipendenze del gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: unixODBC development files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc-dev
      - name: Install Rust 1.98.0 + llvm-tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.98.0
        with:
          toolchain: '1.98.0'
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: Installa cargo-llvm-cov 0.8.7
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Misura e genera i report
        env:
          # Testkit, binding Python e moduli #[cfg(test)] hanno una propria
          # superficie: contarli nel prodotto renderebbe il denominatore
          # dipendente dalla dimensione dei test anziche dal runtime.
          RUST_COVERAGE_IGNORE: '(^|/)(crates/(plenora-database-py|plenora-database-testkit)/|(test_suite|evidence|mariadb_evidence|session_evidence)\.rs$)'
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --locked --workspace --all-features \
            --json --summary-only \
            --output-path coverage/rust/summary.json \
            --ignore-filename-regex "$RUST_COVERAGE_IGNORE" \
            -- --skip live_
          cargo llvm-cov report \
            --lcov --output-path coverage/rust/lcov.info \
            --ignore-filename-regex "$RUST_COVERAGE_IGNORE"
          cargo llvm-cov report \
            --html --output-dir coverage/rust/html \
            --ignore-filename-regex "$RUST_COVERAGE_IGNORE"
      - name: Budget coverage Rust
        run: >-
          python3 scripts/check_coverage.py
          --summary coverage/rust/summary.json
          --surface rust_product
      - name: Report coverage Rust
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: coverage-rust
          path: coverage/rust
          if-no-files-found: error
          retention-days: 14

  python-binding:
    name: binding Python dalla wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Dipendenze del gate e della suite SDK
        run: >-
          python3 -m pip install
          -r requirements-self-tests.txt
          -r requirements-coverage.txt
      - name: Install Rust 1.98.0 + llvm-tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.98.0
        with:
          toolchain: '1.98.0'
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: Installa cargo-llvm-cov 0.8.7
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Costruisce la wheel instrumentata e misura il binding
        shell: bash
        run: |
          mkdir -p coverage/python/dist
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          maturin build --locked \
            --out coverage/python/dist \
            --manifest-path crates/plenora-database-py/Cargo.toml
          python -m pip install --force-reinstall --no-deps coverage/python/dist/*.whl
          bash .github/scripts/offline_suite.sh
          cargo llvm-cov report -p plenora-database-py \
            --json --summary-only \
            --output-path coverage/python/summary.json
          cargo llvm-cov report -p plenora-database-py \
            --lcov --output-path coverage/python/lcov.info
          cargo llvm-cov report -p plenora-database-py \
            --html --output-dir coverage/python/html
      - name: Budget coverage binding Python
        run: >-
          python3 scripts/check_coverage.py
          --summary coverage/python/summary.json
          --surface python_binding
      - name: Report coverage binding Python
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: coverage-python-binding
          path: coverage/python
          if-no-files-found: error
          retention-days: 14
