name: EWKB parser fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/ewkb-fuzz.yml"
      - "fuzz/**"
      - "crates/plenora-database-core/src/ewkb.rs"
  schedule:
    - cron: "31 2 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Bounded campaign duration in seconds"
        required: true
        default: "600"
        type: string

permissions:
  contents: read

concurrency:
  group: ewkb-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ewkb-parser:
    name: EWKB parser / libFuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-27
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install the pinned fuzzing toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" cargo install \
            cargo-fuzz --version 0.13.2 --locked

      # actions/cache v5, resolved to an exact revision on 2026-07-28.
      - name: Restore the evolving EWKB corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: fuzz/corpus/ewkb_parser
          key: ewkb-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ewkb-corpus-${{ runner.os }}-

      - name: Record the execution environment
        run: |
          mkdir -p \
            assurance-results \
            fuzz/artifacts/ewkb_parser \
            fuzz/corpus/ewkb_parser
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'campaign_seconds=%s\n' "$FUZZ_SECONDS"
            rustup run "$RUSTUP_TOOLCHAIN" rustc --version --verbose
            cargo fuzz --version
          } | tee assurance-results/ewkb-fuzz-environment.txt

      - name: Run the bounded EWKB parser campaign
        working-directory: fuzz
        run: |
          cargo fuzz run ewkb_parser corpus/ewkb_parser -- \
            -max_total_time="$FUZZ_SECONDS" \
            -artifact_prefix="artifacts/ewkb_parser/" \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -max_len=1048576 2>&1 |
            tee ../assurance-results/ewkb-fuzz.log

      - name: Record the resulting corpus
        if: always()
        run: |
          find fuzz/corpus/ewkb_parser -type f -print0 |
            sort -z |
            xargs -0 -r sha256sum \
              > assurance-results/ewkb-corpus-sha256.txt
          find fuzz/artifacts/ewkb_parser -type f -print0 |
            sort -z |
            xargs -0 -r sha256sum \
              > assurance-results/ewkb-findings-sha256.txt

      - name: Verify the candidate remained unchanged
        run: git diff --exit-code

      - name: Preserve fuzzing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ewkb-fuzz-${{ github.sha }}
          path: |
            assurance-results/
            fuzz/artifacts/ewkb_parser/
            fuzz/corpus/ewkb_parser/
          if-no-files-found: error
          retention-days: 90
