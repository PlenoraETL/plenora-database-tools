name: spatial-srid-probes

# Le prove live della regola delle sonde spatial: per ogni prodotto, dove il
# server rifiuta una sonda in un altro sistema di riferimento prima di ogni
# riga e dove no. `plenora_database_core::spatial_probe::server_guard` ammette
# una sonda senza catalogo soltanto dove queste misure dicono «guardia».
#
# Questo file non contiene logica di qualifica: un'invocazione per prodotto.
# Le immagini vengono, per digest, da `docker/<prodotto>/references.json` e
# dai compose dei fixture; i container sono usa e getta (`docker run --rm`).

on:
  schedule:
    # Martedi 03:41 UTC, fuori dalle campagne del lunedi.
    - cron: '41 3 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/spatial-srid-probes.yml"
      - "crates/plenora-database-core/src/spatial_probe.rs"
      - "crates/plenora-database-core/src/portable/compiler.rs"
      - "crates/plenora-database-sql/src/lib.rs"
      - "scripts/sonde_srid_server.py"
      - "docker/mysql/references.json"
      - "docker/mariadb/references.json"
      - "docker-compose.postgres.yml"
      - "docker-compose.sqlserver.yml"

permissions:
  contents: read

concurrency:
  group: spatial-srid-probes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probes:
    name: sonde SRID (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [postgres, mysql, mariadb, sqlserver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: dipendenze dei gate Python
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: sonde_srid_server.py
        run: >-
          python3 scripts/sonde_srid_server.py
          --server ${{ matrix.server }}
          --riferimenti
          --referto sonde-srid-${{ matrix.server }}.json
      - name: referto
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonde-srid-${{ matrix.server }}
          path: sonde-srid-${{ matrix.server }}.json
          if-no-files-found: error
