# Suite offline eseguita sotto sanitizer LLVM.
#
# Perche' esiste: il workspace e' `unsafe_code = "forbid"`, quindi il codice
# Plenora non puo' introdurre direttamente errori di memoria. Le dipendenze
# no: `tiberius`, `mysql_async`, `ring`, `arrow-*` e `tokio` contengono
# `unsafe`, e i bug di quel livello si manifestano solo a runtime, su dati
# reali, dentro percorsi che i test offline attraversano comunque.
#
# Perimetro: soltanto la suite che non richiede database. Un sanitizer sui
# test live avrebbe bisogno dei tre container di riferimento, moltiplicando
# durata e rumore senza aggiungere superficie: gli stessi codec e parser sono
# gia' esercitati dai test offline.
#
# Il sanitizer richiede nightly (`-Zsanitizer` non e' accettato su stable),
# quindi `RUSTUP_TOOLCHAIN` scavalca il pin 1.92.0 di `rust-toolchain.toml`
# solo per questo job. `--target` esplicito e' obbligatorio: senza, i
# RUSTFLAGS instrumenterebbero anche build script e proc-macro, che girano
# sull'host e non fanno parte del perimetro misurato.
#
# UBSan non e' nella matrice perche' rustc non espone `-Zsanitizer=undefined`;
# gli overflow aritmetici sono gia' coperti da `overflow-checks` nel profilo
# fuzz. ThreadSanitizer richiederebbe `-Zbuild-std` su tutto lo stack async
# per non produrre falsi positivi e resta fuori da questo perimetro.
name: Offline sanitizer

on:
  pull_request:
    paths:
      - ".github/workflows/offline-sanitizer.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: offline-sanitizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanitized-offline-suite:
    name: ${{ matrix.sanitizer }} / offline test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `address` include LeakSanitizer a fine processo; `leak` isola le
        # perdite senza il costo delle redzone, quindi i due run falliscono
        # per ragioni diverse e vanno tenuti distinti.
        sanitizer: [address, leak]
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-27
      SANITIZER_TARGET: x86_64-unknown-linux-gnu
      # I test offline non aprono socket: qualunque simbolo non risolto e'
      # una regressione di build, non un falso positivo da tollerare.
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_init_order=1
      LSAN_OPTIONS: report_objects=1

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Install the pinned sanitizer toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rust-src \
            --target "$SANITIZER_TARGET"

      # actions/cache v5, resolved to an exact revision on 2026-07-28.
      - name: Restore the sanitizer build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: offline-sanitizer-${{ matrix.sanitizer }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: offline-sanitizer-${{ matrix.sanitizer }}-${{ runner.os }}-

      - name: Record the execution environment
        run: |
          mkdir -p assurance-results
          {
            printf 'commit=%s\n' "$CANDIDATE_SHA"
            printf 'sanitizer=%s\n' "${{ matrix.sanitizer }}"
            printf 'target=%s\n' "$SANITIZER_TARGET"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            rustup run "$RUSTUP_TOOLCHAIN" rustc --version --verbose
          } | tee "assurance-results/offline-sanitizer-${{ matrix.sanitizer }}-environment.txt"

      # Il grafo deve restare quello del candidato: un aggiornamento implicito
      # sposterebbe il sanitizer su dipendenze che il candidato non dichiara.
      - name: Verify the locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run the offline suite under ${{ matrix.sanitizer }}
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }} -Cdebuginfo=1
          # I test live sono marcati `#[ignore]`: senza il flag che li abilita
          # il perimetro resta offline e nessun container e' necessario.
          RUST_BACKTRACE: "1"
        run: |
          cargo test \
            --workspace \
            --locked \
            --target "$SANITIZER_TARGET" \
            -- --test-threads=1 2>&1 |
            tee "assurance-results/offline-sanitizer-${{ matrix.sanitizer }}.log"

      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code

      - name: Preserve sanitizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-sanitizer-${{ matrix.sanitizer }}-${{ env.CANDIDATE_SHA }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90
