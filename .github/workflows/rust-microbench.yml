name: rust-microbench

# Misura offline su ogni revisione proposta. Non applica soglie: un fallimento
# indica che l'harness non compila o non produce misure, non una regressione.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-microbench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: microbenchmark Rust offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.98.0
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: Compila gli harness in release
        run: >-
          cargo build --release --locked --examples
          --package plenora-database-core
          --package plenora-database-sql
          --package plenora-database-engine
          --package plenora-db-mysql
          --package plenora-db-sqlserver
      - name: Misura le superfici offline
        run: |
          mkdir -p benchmark-results
          : > benchmark-results/offline-rust-microbench.jsonl
          for bench in \
            bench_ewkb \
            bench_arrow_contract \
            bench_sql_render \
            bench_plan_pipeline \
            bench_core_application \
            bench_mysql_read_plan \
            bench_sqlserver_read_plan
          do
            "target/release/examples/$bench" 2000 7 \
              >> benchmark-results/offline-rust-microbench.jsonl
          done
      - name: Registra l'ambiente della misura
        run: |
          rustc -Vv > benchmark-results/environment.txt
          cargo -V >> benchmark-results/environment.txt
          uname -a >> benchmark-results/environment.txt
          lscpu >> benchmark-results/environment.txt
          printf 'commit=%s\n' "$GITHUB_SHA" >> benchmark-results/environment.txt
      - name: Pubblica JSONL e ambiente
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-microbench-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
