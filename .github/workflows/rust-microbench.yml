# Microbenchmark Rust offline: misura e pubblica, non giudica.
#
# ATTENZIONE, LEGGERE PRIMA DI AGGIUNGERE UN CONFRONTO.
# Questo workflow non ha e non deve avere soglie, `--fail-under`, confronti
# con una baseline o qualunque altra forma di gate bloccante. Produce misure e
# le carica come artifact: nient'altro.
#
# I budget prestazionali di queste superfici NON sono stati fissati. Fissarli
# e' una decisione di prodotto che spetta al proprietario del repository, non
# all'automazione: un budget inventato in CI e' un gate inerte, che passa
# sempre e non protegge nulla, oppure fallisce a caso e viene disattivato.
# Finche' il proprietario non dichiara i numeri, questo job resta informativo.
# Quando i budget esisteranno, il posto giusto per congelarli e'
# `benchmarks/baseline/`, come gia' avviene per le campagne su database reali,
# e il confronto va aggiunto qui come passo esplicito e separato.
#
# Perimetro: soltanto superfici che girano senza database (rendering SQL,
# compilazione dei read plan, ispezione EWKB, contratto Arrow, pipeline dei
# piani). Le campagne che richiedono PostgreSQL, MySQL o SQL Server restano
# negli script Python di `scripts/check_*_performance.py`, che hanno gia' le
# loro baseline misurate.
#
# I numeri di un runner GitHub condiviso sono rumorosi: servono a osservare
# ordini di grandezza e regressioni macroscopiche, non a distinguere un 5%.
name: Offline Rust microbenchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/rust-microbench.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/*/examples/bench_*.rs"
      - "crates/plenora-database-core/src/**"
      - "crates/plenora-database-sql/src/**"
      - "crates/plenora-database-engine/src/**"
      - "crates/plenora-db-mysql/src/types.rs"
      - "crates/plenora-db-sqlserver/src/types.rs"
  schedule:
    - cron: "29 3 * * 5"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterazioni per scenario"
        required: true
        default: "2000"
        type: string
      repetitions:
        description: "Ripetizioni da cui si prende la mediana"
        required: true
        default: "9"
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: rust-microbench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-microbench:
    name: Offline microbenchmarks / release profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      BENCH_ITERATIONS: ${{ inputs.iterations || '2000' }}
      BENCH_REPETITIONS: ${{ inputs.repetitions || '9' }}

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Record the execution environment
        run: |
          mkdir -p assurance-results
          {
            printf 'commit=%s\n' "$CANDIDATE_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'iterations=%s\n' "$BENCH_ITERATIONS"
            printf 'repetitions=%s\n' "$BENCH_REPETITIONS"
            rustc --version --verbose
            nproc
            cat /proc/cpuinfo | grep -m1 'model name' || true
          } | tee assurance-results/microbench-environment.txt

      # Il profilo release e' l'unico rappresentativo: in debug il costo e'
      # dominato dai controlli del compilatore e le misure non dicono nulla.
      - name: Build the offline benchmark binaries
        run: |
          cargo build --release --locked --examples \
            --package plenora-database-core \
            --package plenora-database-sql \
            --package plenora-database-engine \
            --package plenora-db-mysql \
            --package plenora-db-sqlserver

      - name: Run the offline benchmarks
        run: |
          : > assurance-results/offline-rust-microbench.jsonl
          for binary in \
            bench_plan_pipeline \
            bench_sql_render \
            bench_ewkb \
            bench_arrow_contract \
            bench_mysql_read_plan \
            bench_sqlserver_read_plan
          do
            "target/release/examples/$binary" \
              "$BENCH_ITERATIONS" \
              "$BENCH_REPETITIONS" \
              >> assurance-results/offline-rust-microbench.jsonl
          done
          sha256sum assurance-results/offline-rust-microbench.jsonl \
            > assurance-results/offline-rust-microbench-sha256.txt
          cat assurance-results/offline-rust-microbench.jsonl

      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code

      - name: Preserve the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-rust-microbench-${{ env.CANDIDATE_SHA }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90
