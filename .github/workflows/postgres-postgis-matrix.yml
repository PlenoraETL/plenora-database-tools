name: PostgreSQL and PostGIS compatibility matrix

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/postgres-postgis-matrix.yml"
      - "scripts/check_postgres_matrix.py"
      - "docker/postgres/init/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  compatibility-matrix:
    name: PostgreSQL 14-18 / PostGIS 3.5-3.6
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      # actions/checkout v6, pinned to the exact Node 24 revision resolved on
      # 2026-07-28.
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Record the execution environment
        run: |
          mkdir -p assurance-results ../plenora-cargo-cache
          {
            printf 'commit=%s\n' "$CANDIDATE_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'kernel='
            uname -a
            printf 'python='
            python3 --version
            printf 'docker='
            docker --version
          } | tee assurance-results/matrix-environment.txt

      - name: Run the supported PostgreSQL and PostGIS matrix
        run: |
          python3 scripts/check_postgres_matrix.py \
            --output assurance-results/postgres-postgis-matrix.json 2>&1 |
            tee assurance-results/postgres-postgis-matrix.log

      - name: Record resolved container identities
        if: always()
        run: |
          docker images postgis/postgis --digests --no-trunc \
            > assurance-results/postgis-images.txt
          docker image inspect rust:1.92 \
            --format '{{index .RepoTags 0}} id={{.Id}} digests={{json .RepoDigests}}' \
            > assurance-results/rust-image.txt 2>&1 || true

      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code

      - name: Capture Docker diagnostics
        if: failure()
        run: docker ps -a > assurance-results/docker-containers.txt

      # actions/upload-artifact v7.0.1, pinned to the exact Node 24 revision
      # resolved on 2026-07-28. These reports are execution evidence, not
      # certification.
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-postgis-matrix-${{ env.CANDIDATE_SHA }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral matrix resources
        if: always()
        run: |
          for major in 14 15 16 17 18; do
            docker rm --force "plenora-matrix-pg${major}" 2>/dev/null || true
          done
          docker network rm plenora-database-tools_default 2>/dev/null || true
