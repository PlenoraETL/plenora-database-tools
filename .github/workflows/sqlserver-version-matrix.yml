name: SQL Server version matrix

on:
  pull_request:
    paths:
      - ".github/workflows/sqlserver-version-matrix.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/plenora-database-core/**"
      - "crates/plenora-database-sql/**"
      - "crates/plenora-db-sqlserver/**"
      - "docker/sqlserver/init/**"
      - "scripts/check_sqlserver_matrix.py"
  # I filtri `paths` sopra coprono le modifiche che toccano direttamente la
  # matrice, ma lasciano scoperta la deriva: un test live aggiunto altrove, o
  # un'immagine SQL Server che cambia comportamento a parita' di digest, non
  # riaprono nessuna PR su questi percorsi. E' esattamente cosi' che il
  # registro dei test live e' rimasto disallineato dal 2026-08-04 al
  # 2026-08-07, per giunta dietro un gate che non poteva fallire.
  #
  # Lo schedule rende il gate autonomo dal traffico delle PR. Stessa logica
  # della campagna fuzz schedulata di plenora-data-tools, che e' il motivo per
  # cui un panico raggiungibile da input non fidato e' emerso invece di
  # restare invisibile.
  #
  # Martedi': la matrice PostgreSQL gira gia' il lunedi' ("17 3 * * 1") e tira
  # su container anch'essa, quindi le due restano separate. Minuto non tondo
  # come le altre schedule del repo, per non accodarsi al picco di job
  # schedulati sull'ora esatta.
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Senza `pipefail` questo gate non poteva fallire. Lo step di qualifica
    # manda l'output in pipe a `tee`, e la shell di default di GitHub Actions
    # e' `bash -e`, che NON imposta pipefail: l'exit code della pipeline era
    # quello di `tee`, sempre 0. Il fallimento di check_sqlserver_matrix.py
    # veniva scritto nel log e scartato, e il workflow riportava success.
    # E' il motivo per cui il disallineamento del registro dei test live e'
    # sopravvissuto dal 2026-08-04 senza che nessuno lo vedesse.
    # Gli altri otto workflow del repo hanno gia' questo blocco: qui mancava.
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Qualify pinned SQL Server 2019 and 2025
        run: |
          mkdir -p assurance-results
          python3 scripts/check_sqlserver_matrix.py 2>&1 |
            tee assurance-results/sqlserver-version-matrix.log
      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code -- .
      - name: Preserve matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sqlserver-version-matrix-${{ env.CANDIDATE_SHA }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90
