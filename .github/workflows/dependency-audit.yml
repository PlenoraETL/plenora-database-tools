name: Dependency audit

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/*/Cargo.toml"
      - "fuzz/Cargo.toml"
      - "fuzz/Cargo.lock"
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisories:
    name: RustSec advisories / workspace and fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      # Avvisi già valutati e non risolvibili senza sostituire una dipendenza
      # diretta. Ogni voce va rimossa appena il grafo la supera.
      #
      # RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0104:
      #   rustls-webpki 0.101.7 entra solo via tiberius 0.12.3 -> rustls 0.21.
      #   Le tre segnalazioni riguardano la validazione dei certificati del
      #   server; la CA di SQL Server è fissata dalla configurazione del
      #   provider e non è controllata da chi invia il piano.
      # RUSTSEC-2026-0178:
      #   tokio-postgres 0.7.15 va in panic su un DataRow con meno campi delle
      #   colonne dichiarate. Richiede un server PostgreSQL ostile: la
      #   risoluzione è l'aggiornamento a >=0.7.18, fuori dal perimetro di
      #   questo gate.
      # RUSTSEC-2025-0134:
      #   rustls-pemfile è non manutenuto; entra sia direttamente sia via
      #   tiberius. Nessuna vulnerabilità nota.
      AUDIT_IGNORES: >-
        --ignore RUSTSEC-2026-0098
        --ignore RUSTSEC-2026-0099
        --ignore RUSTSEC-2026-0104
        --ignore RUSTSEC-2026-0178
        --ignore RUSTSEC-2025-0134

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Install the pinned audit toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Record the execution environment
        run: |
          mkdir -p assurance-results
          {
            printf 'commit=%s\n' "$CANDIDATE_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'audit_ignores=%s\n' "$AUDIT_IGNORES"
            rustc --version --verbose
            cargo audit --version
          } | tee assurance-results/dependency-audit-environment.txt

      # I lockfile devono restare risolvibili senza aggiornamenti impliciti:
      # un audit su un grafo ricalcolato non descriverebbe il candidato.
      - name: Verify the locked dependency graphs
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata \
            --manifest-path fuzz/Cargo.toml \
            --locked \
            --format-version 1 > /dev/null

      # L'espansione di AUDIT_IGNORES è volutamente non quotata: la lista deve
      # separarsi in più argomenti.
      - name: Audit the locked workspace dependencies
        run: |
          cargo audit --deny warnings $AUDIT_IGNORES \
            2>&1 | tee assurance-results/dependency-audit-workspace.txt

      - name: Audit the locked fuzz dependencies
        run: |
          cargo audit --deny warnings $AUDIT_IGNORES \
            --file fuzz/Cargo.lock \
            2>&1 | tee assurance-results/dependency-audit-fuzz.txt

      - name: Record the audit evidence
        if: always()
        run: |
          sha256sum assurance-results/dependency-audit-* \
            > assurance-results/dependency-audit-sha256.txt

      - name: Verify the candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && git diff --exit-code

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-${{ env.CANDIDATE_SHA }}
          path: assurance-results/
          if-no-files-found: error
          retention-days: 90
