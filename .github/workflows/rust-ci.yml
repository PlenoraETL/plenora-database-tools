name: rust-ci

# CI di base: verifica che il workspace compili e che clippy pedantic
# non emetta warning. Test live che richiedono Postgres NON vengono
# eseguiti qui (usano #[ignore] o env-guard, richiedono docker compose
# aggiuntivo — vedi gate script `scripts/check_postgres_reference.py`
# per il gate live-full).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: cargo check (default features)
        run: cargo check --workspace --all-targets
      - name: cargo clippy (pedantic + nursery)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-unit:
    name: cargo test (unit + non-live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      # Runna solo i test non-live: quelli marcati #[ignore] o che
      # controllano env vars saranno skippati automaticamente.
      - name: cargo test --workspace (senza live)
        run: cargo test --workspace

# NOTA: cargo fmt --check non è in CI perché il codebase corrente ha
# stile non uniformato pre-Fase-3. Se in futuro si vuole imporre lo
# stile, prima fare `cargo fmt --all` in un commit dedicato e poi
# aggiungere qui il job `fmt`.
