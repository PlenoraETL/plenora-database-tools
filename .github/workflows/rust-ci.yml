name: rust-ci

# CI di base: verifica che il workspace sia formattato, compili e che clippy
# pedantic non emetta warning. Test live che richiedono Postgres NON vengono
# eseguiti qui (usano #[ignore] o env-guard, richiedono docker compose
# aggiuntivo — vedi gate script `scripts/check_postgres_reference.py`
# per il gate live-full).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sola lettura del contenuto: nessun job qui scrive sul repository, pubblica
# pacchetti o commenta le PR.
permissions:
  contents: read

# Una run per riferimento: un push successivo cancella quella in corso invece
# di accodarla su un albero che nessuno guardera piu.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Self-test statici: solo Python, nessuna toolchain, nessuna cache, nessun
  # container, nessun server. Stanno qui perche `rust-ci` e l'unico workflow
  # che gira su ogni push e su ogni PR, ed e la ragione per cui il file che
  # la prima di queste suite sostituisce e rimasto rosso per mesi senza che
  # nessuno lo vedesse: nessun job lo eseguiva. Una suite nuova si aggiunge
  # a questo elenco, non a un file che nessuno esegue.
  static-self-tests:
    name: self-test statici
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: scripts/test_ci_workflows.py
        run: python3 scripts/test_ci_workflows.py
      - name: scripts/test_check_mariadb_reference.py
        run: python3 scripts/test_check_mariadb_reference.py
      - name: scripts/test_check_postgres_reference.py
        run: python3 scripts/test_check_postgres_reference.py
      - name: scripts/test_check_postgres_hardening.py
        run: python3 scripts/test_check_postgres_hardening.py
      # Duplicazione dichiarata: `sqlserver-assurance` esegue gia questo
      # self-test su push. Qui gira anche sulle PR, dove quel workflow parte
      # solo se il diff tocca i path del provider — e un self-test che si
      # accorge di una superficie rotta vale di piu prima del merge che dopo.
      # Il costo e qualche secondo; il beneficio e il fail-fast.
      - name: scripts/test_check_sqlserver_reference.py
        run: python3 scripts/test_check_sqlserver_reference.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0 + rustfmt
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      # Nessuna cache: rustfmt non compila nulla, scaricarla costerebbe piu
      # del job.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0 + clippy
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: cargo check (default features)
        run: cargo check --workspace --all-targets
      # -D warnings applicato SOLO qui, non global via RUSTFLAGS:
      # se lo mettiamo global, cargo check delle deps fallisce su
      # qualsiasi deprecation warning di crate esterni.
      - name: cargo clippy (pedantic + nursery)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Ogni adapter deve costruirsi da solo. La combinazione mysql-only non
  # compilava affatto — `typed_params` e le funzioni dello schema effimero
  # stavano dietro la feature `postgres` pur non avendone bisogno — e nessun
  # job se ne accorgeva: la CI costruiva solo i default e `--all-features`,
  # cioe le due configurazioni in cui PostgreSQL c'e sempre.
  #
  # Le quattro combinazioni girano in **un** job, non in una matrice di
  # quattro. La prima stesura usava `strategy.matrix` e ha fatto fallire la
  # CI a valle di se stessa: sei job in parallelo scaricavano la stessa
  # action di cache nello stesso istante, e `codeload.github.com` ne ha
  # rifiutato uno con 429. Un job solo scarica l'action una volta, riusa la
  # stessa cache per tutte e quattro le configurazioni, e non moltiplica una
  # dipendenza di rete per il numero di cose che vuole verificare.
  cli-feature-matrix:
    name: CLI feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0 + clippy
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      # `--all-targets` include i test: senza, un modulo di test che assume
      # PostgreSQL resterebbe rotto in tre combinazioni su quattro senza che
      # nulla lo dica. Il ciclo le prova tutte prima di fallire, cosi una
      # combinazione rotta non nasconde la successiva.
      #
      # I test che filtrano su `usage` vengono anche **eseguiti**, non solo
      # compilati: sono la guardia che confronta comandi compilati,
      # documentati e rami del dispatch, piu il test d'integrazione che
      # verifica l'aiuto dal binario vero. Il loro valore sta tutto nelle
      # configurazioni non di default — dove `cargo test` del job `test-unit`
      # non arriva, ed e infatti li che l'aiuto mentiva.
      - name: cargo clippy su ogni adapter isolato
        run: |
          status=0
          for features in "--no-default-features --features postgres" "--no-default-features --features mysql" "--no-default-features --features sqlserver" "--all-features"; do
            echo "::group::clippy $features"
            # shellcheck disable=SC2086  # le feature sono argomenti multipli
            if cargo clippy --locked -p plenora-database-cli --all-targets $features -- -D warnings                && cargo test --locked -p plenora-database-cli $features usage; then
              echo "OK   $features"
            else
              echo "FAIL $features"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  test-unit:
    name: cargo test (unit + non-live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      # Runna solo i test non-live. Nel workspace ci sono ~88 test
      # nominati `live_*` (in src/**/tests/) che sono `#[tokio::test]`
      # (non `#[ignore]`) e hardcodano `host=dataflow-postgres` in
      # secret(): senza il container Postgres locale falliscono. Sono
      # coperti dal gate live `scripts/check_postgres_reference.py`
      # invocato out-of-CI. Qui li filtriamo per nome.
      - name: cargo test --workspace (senza live_*)
        run: cargo test --workspace -- --skip live_
