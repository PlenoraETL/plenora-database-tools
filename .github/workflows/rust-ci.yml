name: rust-ci

# CI offline: formattazione, compilazione, lint, test statici e test che non
# richiedono fixture. Le campagne live appartengono ai workflow dei provider.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sola lettura del contenuto: nessun job qui scrive sul repository, pubblica
# pacchetti o commenta le PR.
permissions:
  contents: read

# Una run per riferimento: un push successivo cancella quella in corso invece
# di accodarla su un albero che nessuno guardera piu.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Self-test statici: solo Python, nessuna toolchain, cache, container o
  # server. Una nuova guardia offline entra in questo job, che gira su ogni
  # push e pull request.
  static-self-tests:
    name: self-test statici
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Le dipendenze dei self-test sono dichiarate e pinnate separatamente.
      - name: dipendenze dei self-test
        run: python3 -m pip install -r requirements-self-tests.txt
      - name: scripts/test_ci_workflows.py
        run: python3 scripts/test_ci_workflows.py
      - name: scripts/test_check_mariadb_reference.py
        run: python3 scripts/test_check_mariadb_reference.py
      - name: scripts/test_check_mysql_reference.py
        run: python3 scripts/test_check_mysql_reference.py
      - name: scripts/test_live_inventory.py
        run: python3 -m unittest scripts.test_live_inventory
      - name: scripts/test_check_postgres_reference.py
        run: python3 scripts/test_check_postgres_reference.py
      - name: scripts/test_check_postgres_hardening.py
        run: python3 scripts/test_check_postgres_hardening.py
      - name: scripts/test_check_session_matrix.py
        run: python3 scripts/test_check_session_matrix.py
      - name: scripts/phase0_validate.py
        run: python3 scripts/phase0_validate.py
      - name: scripts/check_docs.py
        run: python3 scripts/check_docs.py
      - name: scripts/check_comments.py
        run: python3 scripts/check_comments.py
      # I test unitari restano moduli figli del codice che verificano, ma il
      # loro corpo vive in file dedicati per tenere leggibile il prodotto.
      - name: scripts/check_test_layout.py
        run: python3 scripts/check_test_layout.py
      # Il refactor misura solo il codice di prodotto: cancellare evidence o
      # spostare test non puo far apparire una riduzione che non esiste. Il
      # budget e una guardia, quindi vive nel workflow che esegue gli altri
      # gate offline e non in una convenzione locale.
      - name: scripts/code_size.py --check
        run: python3 scripts/code_size.py --check
      # La discovery completa include i self-test statici delle matrici e
      # delle campagne prestazionali.
      - name: tests/
        run: python3 -m unittest discover -s tests -t .
      # `docs/STATO.md` e generato: se resta indietro rispetto al codice, e un
      # documento che ha l'aria di essere sempre vero.
      - name: scripts/render_state.py --check
        run: python3 scripts/render_state.py --check
      # Anche il workflow SQL Server lo esegue, ma qui copre tutte le PR.
      - name: scripts/test_check_sqlserver_reference.py
        run: python3 scripts/test_check_sqlserver_reference.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0 + rustfmt
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          components: rustfmt
      # Nessuna cache: rustfmt non compila nulla, scaricarla costerebbe piu
      # del job.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0 + clippy
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: cargo check (default features)
        run: cargo check --workspace --all-targets
      # -D warnings applicato SOLO qui, non global via RUSTFLAGS:
      # se lo mettiamo global, cargo check delle deps fallisce su
      # qualsiasi deprecation warning di crate esterni.
      - name: cargo clippy (pedantic + nursery)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Ogni adapter deve compilare e superare i test anche isolato. Un solo job
  # riusa toolchain e cache, limitando le richieste concorrenti alle action.
  cli-feature-matrix:
    name: CLI feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0 + clippy
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      # `--all-targets` compila anche i test. Il ciclo raccoglie tutte le
      # configurazioni fallite ed esegue l'intera suite non-live per ognuna.
      - name: cargo clippy su ogni adapter isolato
        run: |
          status=0
          for features in "--no-default-features --features postgres" "--no-default-features --features mysql" "--no-default-features --features sqlserver" "--all-features"; do
            echo "::group::clippy $features"
            # shellcheck disable=SC2086  # le feature sono argomenti multipli
            if cargo clippy --locked -p plenora-database-cli --all-targets $features -- -D warnings                && cargo test --locked -p plenora-database-cli $features -- --skip live_; then
              echo "OK   $features"
            else
              echo "FAIL $features"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # La suite SDK offline protegge ogni push e PR. Il wheel di debug serve solo
  # come modulo nativo importabile; gli artefatti distribuibili sono costruiti
  # dal workflow `python-wheel`.
  sdk-offline:
    name: suite SDK offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build wheel di debug
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.14.1'
          command: build
          args: >-
            --locked
            --out dist
            --manifest-path crates/plenora-database-py/Cargo.toml
          rust-toolchain: '1.92.0'
      - name: Installa il wheel
        run: python -m pip install dist/*.whl
      - name: .github/scripts/offline_suite.sh
        run: bash .github/scripts/offline_suite.sh

  test-unit:
    name: cargo test (unit + non-live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      # I test `live_*` richiedono le fixture e sono coperti dalle campagne dei
      # provider; questo job esegue il resto del workspace.
      - name: cargo test --workspace (senza live_*)
        run: cargo test --workspace -- --skip live_
