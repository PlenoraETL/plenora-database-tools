# Progetto Compose esplicito. Senza questa riga Compose deriva il nome
# dalla directory, quindi tutti i compose del repository finirebbero nello
# stesso progetto e `down --remove-orphans` su uno cancellerebbe i
# container degli altri provider.
name: plenora-postgres

services:
  postgres:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: dataflow-postgres
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow_test_2026
      POSTGRES_DB: dataflow_test
    # Loopback esplicito. Senza l'indirizzo, Compose pubblica su 0.0.0.0 e
    # un fixture con credenziali versionate diventa raggiungibile da tutta la
    # rete locale. Stessa forma gia usata dai fixture MySQL e MariaDB.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Il parametro governa le password create da qui in poi; i verifier già
    # presenti nei volumi restano utilizzabili. Il fixture TLS usa SCRAM.
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow -d dataflow_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

volumes:
  postgres_data:
